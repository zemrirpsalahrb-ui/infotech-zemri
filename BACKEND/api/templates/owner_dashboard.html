<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Mon Dashboard Privé — Gestion Produits, Prix & Photos | LOGISZ CCTV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      max-width: 100vw;
      width: 100%;
      overflow-x: hidden;
      position: relative;
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .btn-touch {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    input, select, textarea {
      font-size: 16px !important; /* Évite le zoom automatique sur iPhone */
    }
    @media (min-width: 640px) {
      input, select, textarea {
        font-size: 14px !important;
      }
    }
    /* Animation pulse upload */
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-pulse-fast {
      animation: pulse-fast 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 pb-12">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  {% verbatim %}
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const API_BASE = "/api/v1";

    function fmtMoney(val) {
      const n = Number(val || 0);
      return n.toLocaleString("fr-DZ", { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + " DA";
    }

    // Compression côté client pour téléversement ultra-rapide sur smartphone (3G/4G/5G)
    function compressImageFile(file, maxDimension = 1400, quality = 0.85) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > maxDimension || h > maxDimension) {
              if (w > h) {
                h = Math.round((h * maxDimension) / w);
                w = maxDimension;
              } else {
                w = Math.round((w * maxDimension) / h);
                h = maxDimension;
              }
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function OwnerDashboardApp() {
      const [token, setToken] = useState(() => localStorage.getItem("cctv_jwt") || "");
      const [profile, setProfile] = useState(null);
      const [authChecked, setAuthChecked] = useState(false);
      const [loginForm, setLoginForm] = useState({ username: "admin", password: "admin123" });

      const [section, setSection] = useState("products"); // products, orders, accounts, store
      const [products, setProducts] = useState([]);
      const [categories, setCategories] = useState([]);
      const [stats, setStats] = useState(null);
      const [accounts, setAccounts] = useState([]);
      const [loading, setLoading] = useState(false);
      const [toast, setToast] = useState(null);

      // Filtres & Recherche
      const [searchQ, setSearchQ] = useState("");
      const [filterVis, setFilterVis] = useState("all"); // all, active, hidden
      const [filterPhoto, setFilterPhoto] = useState("all"); // all, with_photo, no_photo
      const [filterCat, setFilterCat] = useState("all");
      const [selectedIds, setSelectedIds] = useState([]);

      // Suivi de prise de photo par article (pour afficher le spinner directement sur le bouton du produit)
      const [uploadingProdId, setUploadingProdId] = useState(null);
      const directCameraInputRef = useRef(null);
      const [targetProdForDirectCamera, setTargetProdForDirectCamera] = useState(null);

      // Modal Galerie Photo Complète
      const [photoModalProd, setPhotoModalProd] = useState(null);
      const [newImageUrl, setNewImageUrl] = useState("");
      const [newImageFile, setNewImageFile] = useState(null);
      const [previewUrl, setPreviewUrl] = useState("");
      const [replaceAllPhotos, setReplaceAllPhotos] = useState(false);
      const [uploading, setUploading] = useState(false);

      // Modification Rapide de Prix (Spécial Smartphone)
      const [quickPriceProd, setQuickPriceProd] = useState(null);
      const [quickPriceForm, setQuickPriceForm] = useState({ public_price: "", reseller_price: "" });
      const [quickSaving, setQuickSaving] = useState(false);

      // Modal Édition Complète
      const [editModalProd, setEditModalProd] = useState(null);
      const [editForm, setEditForm] = useState({});
      const [storeData, setStoreData] = useState({ photos: [], store: {} });
      const [storeUploading, setStoreUploading] = useState(false);

      const showToast = (msg, type = "success") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      const authHeaders = useMemo(() => {
        const h = { "Content-Type": "application/json" };
        if (token) h["Authorization"] = `Bearer ${token}`;
        return h;
      }, [token]);

      const checkAuthAndLoad = async () => {
        if (!token) {
          setProfile(null);
          setAuthChecked(true);
          return;
        }
        try {
          const res = await fetch(`${API_BASE}/auth/me/`, { headers: authHeaders });
          if (res.ok) {
            const d = await res.json();
            if (d.profile && d.profile.is_admin) {
              setProfile(d.profile);
              await loadAllData();
            } else {
              setProfile(null);
              showToast("Accès réservé uniquement au propriétaire (Admin).", "error");
            }
          } else {
            localStorage.removeItem("cctv_jwt");
            setToken("");
            setProfile(null);
          }
        } catch (e) {
        } finally {
          setAuthChecked(true);
        }
      };

      const loadAllData = async () => {
        setLoading(true);
        try {
          const [rProds, rHome, rStats, rAcc] = await Promise.all([
            fetch(`${API_BASE}/admin/products/?limit=600`, { headers: authHeaders }),
            fetch(`${API_BASE}/catalog/home/`, { headers: authHeaders }),
            fetch(`${API_BASE}/admin/dashboard/`, { headers: authHeaders }),
            fetch(`${API_BASE}/admin/accounts/`, { headers: authHeaders })
          ]);
          if (rProds.ok) {
            const prodsList = await rProds.json();
            setProducts(prodsList);
            if (photoModalProd) {
              const updated = prodsList.find(x => x.id === photoModalProd.id);
              if (updated) setPhotoModalProd(updated);
            }
          }
          if (rHome.ok) {
            const h = await rHome.json();
            setCategories(h.categories || []);
          }
          if (rStats.ok) setStats(await rStats.json());
          if (rAcc.ok) setAccounts(await rAcc.json());
          try {
            const rStore = await fetch(`${API_BASE}/store/photos/`);
            if (rStore.ok) setStoreData(await rStore.json());
          } catch (e) {}
        } catch (e) {
          showToast("Erreur lors du chargement des données", "error");
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        checkAuthAndLoad();
      }, [token]);

      const handleLogin = async (e) => {
        e.preventDefault();
        const res = await fetch(`${API_BASE}/auth/login/`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(loginForm)
        });
        const data = await res.json();
        if (res.ok) {
          if (!data.profile.is_admin) {
            showToast("Ce compte n'est pas administrateur.", "error");
            return;
          }
          localStorage.setItem("cctv_jwt", data.access);
          setToken(data.access);
          setProfile(data.profile);
          showToast("Bienvenue dans votre espace propriétaire !", "success");
        } else {
          showToast(data.error || "Identifiants incorrects", "error");
        }
      };

      const updateProductField = async (prodId, fields, successMsg) => {
        const res = await fetch(`${API_BASE}/admin/products/${prodId}/`, {
          method: "PUT",
          headers: authHeaders,
          body: JSON.stringify(fields)
        });
        if (res.ok) {
          const updated = await res.json();
          setProducts(prev => prev.map(p => p.id === prodId ? updated : p));
          if (successMsg) showToast(successMsg, "success");
          return updated;
        } else {
          showToast("Erreur lors de la mise à jour", "error");
          return null;
        }
      };

      // Déclencheur direct de l'appareil photo du smartphone
      const triggerDirectCamera = (prod) => {
        setTargetProdForDirectCamera(prod);
        if (directCameraInputRef.current) {
          directCameraInputRef.current.value = "";
          directCameraInputRef.current.click();
        }
      };

      // Traitement direct de la photo prise par l'appareil photo du smartphone
      const handleDirectCameraCapture = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file || !targetProdForDirectCamera) return;

        const prod = targetProdForDirectCamera;
        setUploadingProdId(prod.id);
        try {
          // Compression en direct
          const b64 = await compressImageFile(file, 1400, 0.85);

          const res = await fetch(`${API_BASE}/admin/products/${prod.id}/images/`, {
            method: "POST",
            headers: authHeaders,
            body: JSON.stringify({
              image_base64: b64,
              is_main: true,
              replace_all: false
            })
          });
          const d = await res.json();
          if (res.ok && d.product) {
            setProducts(prev => prev.map(p => p.id === prod.id ? d.product : p));
            showToast(`📸 Photo enregistrée pour « ${prod.name} » !`, "success");
          } else {
            showToast(d.error || "Erreur lors de l'enregistrement de la photo", "error");
          }
        } catch (err) {
          showToast("Erreur de prise de photo", "error");
        } finally {
          setUploadingProdId(null);
          setTargetProdForDirectCamera(null);
        }
      };

      // Modal Galerie Photo Upload
      const handleUploadPhoto = async () => {
        if (!photoModalProd) return;
        if (!newImageUrl.trim() && !newImageFile) {
          showToast("Prenez une photo ou sélectionnez une image.", "error");
          return;
        }
        setUploading(true);
        try {
          let payload = { is_main: true, replace_all: replaceAllPhotos };
          if (newImageFile) {
            payload.image_base64 = await compressImageFile(newImageFile, 1400, 0.85);
          } else {
            payload.image_url = newImageUrl.trim();
          }

          const res = await fetch(`${API_BASE}/admin/products/${photoModalProd.id}/images/`, {
            method: "POST",
            headers: authHeaders,
            body: JSON.stringify(payload)
          });
          const d = await res.json();
          if (res.ok) {
            showToast("Photo ajoutée avec succès !", "success");
            setNewImageUrl("");
            setNewImageFile(null);
            setPreviewUrl("");
            if (d.product) {
              setPhotoModalProd(d.product);
              setProducts(prev => prev.map(p => p.id === d.product.id ? d.product : p));
            }
          } else {
            showToast(d.error || "Erreur d'envoi", "error");
          }
        } catch (err) {
          showToast("Erreur de connexion", "error");
        } finally {
          setUploading(false);
        }
      };

      const handleSetMainImage = async (prodId, imageId) => {
        const res = await fetch(`${API_BASE}/admin/products/${prodId}/images/${imageId}/`, {
          method: "PATCH",
          headers: authHeaders,
          body: JSON.stringify({ is_main: true })
        });
        if (res.ok) {
          showToast("Photo principale définie", "success");
          await loadAllData();
        }
      };

      const handleDeleteImage = async (prodId, imageId) => {
        const res = await fetch(`${API_BASE}/admin/products/${prodId}/images/${imageId}/`, {
          method: "DELETE",
          headers: authHeaders
        });
        if (res.ok) {
          showToast("Photo supprimée", "success");
          await loadAllData();
        }
      };

      // Modification Rapide de Prix (Pop-in Bottom Sheet sur Smartphone)
      const openQuickPrice = (prod) => {
        setQuickPriceProd(prod);
        setQuickPriceForm({
          public_price: prod.public_price || "",
          reseller_price: prod.tier_prices?.reseller_price ?? (prod.public_price || "")
        });
      };

      const handleSaveQuickPrice = async (e) => {
        e.preventDefault();
        if (!quickPriceProd) return;
        const pub = Number(quickPriceForm.public_price);
        const gros = Number(quickPriceForm.reseller_price);
        if (isNaN(pub) || pub < 0) {
          showToast("Prix public invalide", "error");
          return;
        }
        setQuickSaving(true);
        try {
          const payload = {
            public_price: pub,
            tier_prices: {
              ...(quickPriceProd.tier_prices || {}),
              reseller_price: isNaN(gros) || gros <= 0 ? pub : gros
            }
          };
          const updated = await updateProductField(
            quickPriceProd.id,
            payload,
            `Prix mis à jour : ${fmtMoney(pub)} (Gros : ${fmtMoney(payload.tier_prices.reseller_price)})`
          );
          if (updated) {
            setQuickPriceProd(null);
          }
        } finally {
          setQuickSaving(false);
        }
      };

      // Modal Édition Complète
      const openEditModal = (p) => {
        setEditModalProd(p);
        setEditForm({
          name: p.name || "",
          category: p.category || "",
          public_price: p.public_price || 0,
          promo_price: p.promo_price || "",
          installer_price: p.tier_prices?.installer_price ?? p.public_price,
          reseller_price: p.tier_prices?.reseller_price ?? p.public_price,
          short_description: p.short_description || "",
          description: p.description || "",
          warranty_months: p.warranty_months || 12,
          is_active: p.is_active,
          is_featured: p.is_featured,
          is_bestseller: p.is_bestseller,
          is_new_arrival: p.is_new_arrival,
          is_special_offer: p.is_special_offer
        });
      };

      const handleSaveEditProduct = async (e) => {
        e.preventDefault();
        const payload = {
          ...editForm,
          promo_price: editForm.promo_price === "" ? null : editForm.promo_price,
          category: editForm.category === "" ? null : editForm.category
        };
        const updated = await updateProductField(editModalProd.id, payload, "Article mis à jour avec succès !");
        if (updated) setEditModalProd(null);
      };

      const handleBulkVisibility = async (makeActive) => {
        if (selectedIds.length === 0) return;
        setLoading(true);
        let okCount = 0;
        for (const id of selectedIds) {
          const res = await fetch(`${API_BASE}/admin/products/${id}/`, {
            method: "PUT",
            headers: authHeaders,
            body: JSON.stringify({ is_active: makeActive })
          });
          if (res.ok) okCount++;
        }
        setSelectedIds([]);
        await loadAllData();
        showToast(`${okCount} article(s) ${makeActive ? "publié(s) sur le site" : "masqué(s)"}.`, "success");
      };

      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          if (searchQ.trim()) {
            const q = searchQ.toLowerCase();
            if (!(p.name || "").toLowerCase().includes(q) &&
                !(p.reference || "").toLowerCase().includes(q) &&
                !(p.brand_name || "").toLowerCase().includes(q)) return false;
          }
          if (filterVis === "active" && !p.is_active) return false;
          if (filterVis === "hidden" && p.is_active) return false;
          const hasImg = (p.images && p.images.length > 0) || (p.main_image && p.main_image.trim() !== "");
          if (filterPhoto === "with_photo" && !hasImg) return false;
          if (filterPhoto === "no_photo" && hasImg) return false;
          if (filterCat !== "all" && String(p.category) !== String(filterCat)) return false;
          return true;
        });
      }, [products, searchQ, filterVis, filterPhoto, filterCat]);

      const counts = useMemo(() => {
        const total = products.length;
        const active = products.filter(p => p.is_active).length;
        const hidden = total - active;
        const withPhoto = products.filter(p => (p.images && p.images.length > 0) || (p.main_image && p.main_image.trim() !== "")).length;
        return { total, active, hidden, withPhoto, noPhoto: total - withPhoto };
      }, [products]);

      if (!authChecked) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 text-slate-500 font-semibold text-sm">
            <span className="animate-spin inline-block mr-2">↻</span> Chargement de votre espace privé...
          </div>
        );
      }

      // ÉCRAN DE CONNEXION (POUR SMARTPHONE & PC)
      if (!profile || !profile.is_admin) {
        return (
          <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
            <div className="card max-w-md w-full p-6 sm:p-8 space-y-6">
              <div className="text-center space-y-2">
                <div className="w-14 h-14 rounded-2xl bg-slate-900 text-white flex items-center justify-center font-extrabold text-2xl mx-auto shadow-md">
                  LZ
                </div>
                <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900">Mon Dashboard Mobile</h1>
                <p className="text-xs text-slate-500">
                  Connectez-vous pour prendre des photos et modifier les prix directement depuis votre smartphone.
                </p>
              </div>

              {toast && (
                <div className={`p-3 rounded-xl text-xs font-semibold ${toast.type === "error" ? "bg-red-50 text-red-700 border border-red-200" : "bg-emerald-50 text-emerald-700 border border-emerald-200"}`}>
                  {toast.msg}
                </div>
              )}

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="text-xs font-bold text-slate-700 block mb-1.5">Nom d'utilisateur</label>
                  <input
                    required
                    value={loginForm.username}
                    onChange={e => setLoginForm({ ...loginForm, username: e.target.value })}
                    className="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>
                <div>
                  <label className="text-xs font-bold text-slate-700 block mb-1.5">Mot de passe</label>
                  <input
                    required
                    type="password"
                    placeholder="••••••••"
                    value={loginForm.password}
                    onChange={e => setLoginForm({ ...loginForm, password: e.target.value })}
                    className="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>
                <button type="submit" className="w-full py-3.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-sm shadow-md btn-touch">
                  Accéder à mon Dashboard →
                </button>
              </form>

              <div className="p-3 rounded-xl bg-blue-50 border border-blue-200 text-xs text-blue-900 space-y-1">
                <div className="font-bold text-blue-800">🔑 Identifiants Admin par défaut :</div>
                <div>Utilisateur : <strong className="font-mono text-slate-900">admin</strong> | Mot de passe : <strong className="font-mono text-slate-900">admin123</strong></div>
              </div>

              <div className="text-center pt-2 border-t border-slate-100">
                <a href="/" className="text-xs text-blue-600 hover:underline font-bold">← Ouvrir la vitrine publique du site</a>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 w-full overflow-x-hidden">
          {/* INPUT CACHÉ DIRECT CAMERA SMARTPHONE (capture="environment" lance l'appareil photo immédiatement) */}
          <input
            type="file"
            accept="image/*"
            capture="environment"
            ref={directCameraInputRef}
            onChange={handleDirectCameraCapture}
            className="hidden"
          />

          {/* HEADER MOBILE & DESKTOP (SANS AUCUN DÉBORDEMENT) */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm w-full">
            <div className="max-w-7xl mx-auto px-3 sm:px-6 py-2.5 flex items-center justify-between gap-2">
              <div className="flex items-center gap-2.5 min-w-0">
                <div className="w-9 h-9 shrink-0 rounded-xl bg-slate-900 text-white flex items-center justify-center font-extrabold text-sm shadow">
                  LZ
                </div>
                <div className="min-w-0">
                  <h1 className="font-extrabold text-sm sm:text-base text-slate-900 truncate">
                    Mon Dashboard Mobile
                  </h1>
                  <div className="text-[11px] text-slate-500 truncate flex items-center gap-1.5">
                    <span className="w-2 h-2 rounded-full bg-emerald-500 inline-block shrink-0"></span>
                    <span className="truncate">{profile.username} • {counts.total} articles</span>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-1.5 shrink-0">
                <a
                  href="/"
                  className="px-2.5 sm:px-3 py-1.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-bold inline-flex items-center gap-1"
                  title="Voir la vitrine publique"
                >
                  <span>🌐</span>
                  <span className="hidden sm:inline">Voir Site</span>
                </a>
                <button
                  onClick={loadAllData}
                  disabled={loading}
                  className="p-2 sm:px-3 sm:py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold inline-flex items-center gap-1"
                  title="Actualiser les données"
                >
                  <span className={loading ? "animate-spin inline-block" : ""}>↻</span>
                  <span className="hidden sm:inline">Actualiser</span>
                </button>
                <button
                  onClick={() => { localStorage.removeItem("cctv_jwt"); setToken(""); setProfile(null); }}
                  className="p-2 sm:px-2.5 sm:py-1.5 rounded-xl border border-red-200 text-red-600 hover:bg-red-50 text-xs font-bold"
                  title="Déconnexion"
                >
                  🚪
                </button>
              </div>
            </div>

            {/* BARRE D'ONGLETS HORIZONTALE SCROLLABLE (TOUCH-FRIENDLY, AUCUN DÉBORDEMENT) */}
            <div className="px-3 sm:px-6 pb-2 pt-1 border-t border-slate-100 flex items-center gap-2 overflow-x-auto no-scrollbar whitespace-nowrap">
              <button
                onClick={() => setSection("products")}
                className={`px-3.5 py-1.5 rounded-xl text-xs font-extrabold transition shrink-0 ${section === "products" ? "bg-slate-900 text-white shadow-sm" : "bg-slate-100 text-slate-700 hover:bg-slate-200"}`}
              >
                📦 Articles & Photos ({counts.total})
              </button>
              <button
                onClick={() => setSection("orders")}

                  {(stats.recent_orders || []).map(o => (
                    <div key={o.id} className="p-3.5 rounded-xl border border-slate-200 bg-white space-y-2">
                      <div className="flex items-start justify-between gap-2">
                        <div>
                          <div className="font-extrabold text-sm text-slate-900">{o.customer_name}</div>
                          <div className="text-xs text-slate-600 font-mono font-bold mt-0.5">📞 {o.customer_phone}</div>
                        </div>
                        <div className="text-right">
                          <div className="font-extrabold text-sm sm:text-base text-blue-700">{fmtMoney(o.total_amount)}</div>
                          <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 uppercase">
                            {o.status}
                          </span>
                        </div>
                      </div>
                      <div className="text-xs text-slate-500 flex flex-wrap gap-2 pt-1 border-t border-slate-100">
                        <span>Wilaya : <strong>{o.wilaya}</strong></span>
                        <span>• N° Commande : <strong className="font-mono">{o.order_uid}</strong></span>
                        {o.pos_converted && <span className="text-emerald-700 font-bold">• Converti en bon POS N° {o.pos_bon_number}</span>}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ==================== SECTION 3: COMPTES PRO ==================== */}
            {section === "accounts" && (
              <div className="card p-4 sm:p-6 space-y-4">
                <h2 className="text-base sm:text-lg font-extrabold text-slate-900">Validation des Comptes Pro</h2>
                <div className="space-y-3">
                  {accounts.map(acc => (
                    <div key={acc.id} className="p-3.5 rounded-xl border border-slate-200 bg-white space-y-2.5">
                      <div className="flex justify-between items-start gap-2">
                        <div>
                          <div className="font-extrabold text-sm text-slate-900">{acc.username}</div>
                          <div className="text-xs text-slate-500">{acc.company_name || "Particulier"} • Statut : <strong className="text-slate-700">{acc.approval_status}</strong></div>
                        </div>
                        <span className="text-xs font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded-lg">
                          Tarif : {acc.effective_tier}
                        </span>
                      </div>
                      <div className="grid grid-cols-2 gap-2 pt-1">
                        <button
                          onClick={async () => {
                            await fetch(`${API_BASE}/admin/accounts/${acc.id}/moderate/`, {
                              method: "POST", headers: authHeaders, body: JSON.stringify({ action: "APPROVE" })
                            });
                            showToast(`Compte ${acc.username} approuvé !`, "success");
                            loadAllData();
                          }}
                          className="btn-touch py-2 rounded-xl bg-emerald-600 text-white text-xs font-extrabold shadow-sm"
                        >
                          ✓ Approuver
                        </button>
                        <button
                          onClick={async () => {
                            await fetch(`${API_BASE}/admin/accounts/${acc.id}/moderate/`, {
                              method: "POST", headers: authHeaders, body: JSON.stringify({ action: "REJECT" })
                            });
                            showToast(`Compte ${acc.username} refusé`, "success");
                            loadAllData();
                          }}
                          className="btn-touch py-2 rounded-xl border border-red-200 text-red-600 hover:bg-red-50 text-xs font-extrabold"
                        >
                          ✕ Refuser
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ==================== SECTION 4: PHOTOS DU MAGASIN ==================== */}
            {section === "store" && (
              <div className="card p-4 sm:p-6 space-y-5">
                <div className="flex flex-wrap justify-between items-center gap-3 border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="text-base sm:text-lg font-extrabold text-slate-900">Photos de Votre Magasin ({storeData.photos.length})</h3>
                    <p className="text-xs text-slate-500">Ces photos s'affichent sur la section « Notre Magasin » de la page d'accueil du site.</p>
                  </div>
                  <div>
                    <label className="btn-touch px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-extrabold cursor-pointer inline-flex items-center gap-2 shadow-sm">
                      <span>📸 Prendre / Ajouter Photo Magasin</span>
                      <input
                        type="file"
                        accept="image/*"
                        capture="environment"
                        onChange={async (e) => {
                          const file = e.target.files && e.target.files[0];
                          if (!file) return;
                          setStoreUploading(true);
                          try {
                            const b64 = await compressImageFile(file, 1600, 0.85);
                            const res = await fetch(`${API_BASE}/store/photos/`, {
                              method: "POST",
                              headers: authHeaders,
                              body: JSON.stringify({ image_base64: b64 })
                            });
                            if (res.ok) {
                              showToast("Photo du magasin ajoutée avec succès !", "success");
                              const rStore = await fetch(`${API_BASE}/store/photos/`);
                              if (rStore.ok) setStoreData(await rStore.json());
                            } else {
                              showToast("Erreur lors de l'ajout", "error");
                            }
                          } catch (err) {
                            showToast("Erreur de connexion", "error");
                          } finally {
                            setStoreUploading(false);
                          }
                        }}
                        disabled={storeUploading}
                        className="hidden"
                      />
                    </label>
                  </div>
                </div>

                {storeUploading && (
                  <div className="p-3 rounded-xl bg-blue-50 border border-blue-200 text-xs text-blue-700 font-bold text-center animate-pulse">
                    Téléversement de la photo du magasin en cours...
                  </div>
                )}

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  {storeData.photos.map((url, i) => (
                    <div key={url} className="rounded-xl border border-slate-200 overflow-hidden bg-white shadow-sm flex flex-col justify-between">
                      <div className="relative h-32 sm:h-40 bg-slate-100 overflow-hidden">
                        <img src={url} alt={`Magasin ${i + 1}`} className="w-full h-full object-cover" />
                      </div>
                      <div className="p-2 flex justify-between items-center bg-slate-50 border-t border-slate-100">
                        <span className="text-[10px] text-slate-500 font-mono truncate max-w-[80px]">Photo #{i + 1}</span>
                        <button
                          onClick={async () => {
                            if (!confirm("Supprimer cette photo ?")) return;
                            await fetch(`${API_BASE}/store/photos/`, {
                              method: "DELETE",
                              headers: authHeaders,
                              body: JSON.stringify({ url })
                            });
                            showToast("Photo supprimée", "success");
                            const rStore = await fetch(`${API_BASE}/store/photos/`);
                            if (rStore.ok) setStoreData(await rStore.json());
                          }}
                          className="text-xs text-red-600 font-bold hover:underline"
                        >
                          ✕
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* ======================================================== */}
          {/* MODAL RAPIDE MODIFICATION PRIX (POP-UP SMARTPHONE ULTRA SIMPLE) */}
          {/* ======================================================== */}
          {quickPriceProd && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={() => setQuickPriceProd(null)}>
              <form
                onSubmit={handleSaveQuickPrice}
                className="card w-full sm:max-w-md p-5 sm:p-6 space-y-4 rounded-t-3xl sm:rounded-2xl max-h-[90vh] overflow-y-auto animate-in slide-in-from-bottom"
                onClick={e => e.stopPropagation()}
              >
                <div className="flex justify-between items-start border-b border-slate-100 pb-3">
                  <div>
                    <span className="text-[11px] font-bold text-blue-600 uppercase">Modification Rapide du Prix</span>
                    <h3 className="text-base sm:text-lg font-extrabold text-slate-900 leading-snug">{quickPriceProd.name}</h3>
                    <span className="font-mono text-xs text-slate-500">Réf : {quickPriceProd.reference}</span>
                  </div>
                  <button type="button" onClick={() => setQuickPriceProd(null)} className="p-2 text-slate-400 hover:text-slate-800 text-xl font-bold">✕</button>
                </div>

                <div className="space-y-3.5">
                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">
                      Prix de Vente Détail / Public (DA) *
                    </label>
                    <input
                      type="number"
                      step="0.01"
                      required
                      autoFocus
                      value={quickPriceForm.public_price}
                      onChange={e => setQuickPriceForm({ ...quickPriceForm, public_price: e.target.value })}
                      placeholder="Ex: 12500"
                      className="w-full px-4 py-3 rounded-xl border-2 border-blue-500 font-extrabold text-lg text-slate-900 bg-blue-50/20 focus:bg-white focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">
                      Prix de Vente Gros / Revendeur (DA)
                    </label>
                    <input
                      type="number"
                      step="0.01"
                      value={quickPriceForm.reseller_price}
                      onChange={e => setQuickPriceForm({ ...quickPriceForm, reseller_price: e.target.value })}
                      placeholder="Ex: 10500"
                      className="w-full px-4 py-3 rounded-xl border border-slate-300 font-bold text-base text-slate-900 focus:outline-none focus:border-blue-500"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2.5 pt-2 border-t border-slate-100">
                  <button
                    type="button"
                    onClick={() => setQuickPriceProd(null)}
                    className="btn-touch py-3 rounded-xl border border-slate-300 text-slate-700 font-bold text-xs"
                  >
                    Annuler
                  </button>
                  <button
                    type="submit"
                    disabled={quickSaving}
                    className="btn-touch py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-sm shadow-md"
                  >
                    {quickSaving ? "Enregistrement..." : "✓ Enregistrer le prix"}
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL GALERIE PHOTOS COMPLÈTE */}
          {/* ======================================================== */}
          {photoModalProd && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={() => setPhotoModalProd(null)}>
              <div className="card w-full sm:max-w-xl p-5 sm:p-6 space-y-4 rounded-t-3xl sm:rounded-2xl max-h-[92vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-start border-b border-slate-100 pb-3">
                  <div>
                    <span className="text-[11px] font-bold text-blue-600 uppercase">Photos de l'Article</span>
                    <h3 className="text-base sm:text-lg font-extrabold text-slate-900">{photoModalProd.name}</h3>
                    <div className="text-xs text-slate-500 font-mono">Réf: {photoModalProd.reference}</div>
                  </div>
                  <button onClick={() => setPhotoModalProd(null)} className="p-2 text-slate-400 hover:text-slate-800 text-xl font-bold">✕</button>
                </div>

                {/* PHOTOS ACTUELLES */}
                <div className="space-y-2">
                  <div className="text-xs font-bold text-slate-700 uppercase">Photos enregistrées ({(photoModalProd.images || []).length})</div>
                  {(!photoModalProd.images || photoModalProd.images.length === 0) ? (
                    <div className="p-4 rounded-xl bg-slate-50 border border-dashed border-slate-300 text-center text-xs text-slate-500">
                      Aucune photo pour le moment.
                    </div>
                  ) : (
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                      {photoModalProd.images.map(img => (
                        <div key={img.id} className={`rounded-xl border p-2 space-y-2 ${img.is_main ? "border-blue-500 bg-blue-50/40" : "border-slate-200 bg-white"}`}>
                          <img src={img.image_url} alt="" className="w-full h-24 object-cover rounded-lg" />
                          <div className="flex justify-between items-center gap-1">
                            {img.is_main ? (
                              <span className="text-[10px] font-bold text-blue-700 bg-blue-100 px-2 py-0.5 rounded-full">★ Principale</span>
                            ) : (
                              <button onClick={() => handleSetMainImage(photoModalProd.id, img.id)} className="text-[10px] font-bold text-slate-600 hover:text-blue-600">
                                Définir princ.
                              </button>
                            )}
                            <button onClick={() => handleDeleteImage(photoModalProd.id, img.id)} className="text-[10px] font-bold text-red-600 hover:underline">
                              ✕
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* AJOUTER NOUVELLE PHOTO (CAMERA DIRECTE OU FICHIER OU URL) */}
                <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-3">
                  <div className="text-xs font-bold text-slate-800 uppercase">Prendre ou ajouter une photo</div>

                  <div className="grid grid-cols-2 gap-2">
                    <label className="btn-touch py-2.5 px-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold text-center cursor-pointer flex items-center justify-center gap-1.5 shadow-sm">
                      <span>📸</span>
                      <span>Appareil Photo</span>
                      <input
                        type="file"
                        accept="image/*"
                        capture="environment"
                        onChange={e => {
                          const file = e.target.files[0] || null;
                          setNewImageFile(file);
                          if (file) setPreviewUrl(URL.createObjectURL(file));
                        }}
                        className="hidden"
                      />
                    </label>

                    <label className="btn-touch py-2.5 px-3 rounded-xl border border-slate-300 bg-white hover:bg-slate-100 text-slate-800 text-xs font-bold text-center cursor-pointer flex items-center justify-center gap-1.5 shadow-sm">
                      <span>📁</span>
                      <span>Galerie Fichier</span>
                      <input
                        type="file"
                        accept="image/*"
                        onChange={e => {
                          const file = e.target.files[0] || null;
                          setNewImageFile(file);
                          if (file) setPreviewUrl(URL.createObjectURL(file));
                        }}
                        className="hidden"
                      />
                    </label>
                  </div>

                  <div>
                    <label className="text-[11px] text-slate-600 block mb-1 font-semibold">Ou coller un lien d'image web :</label>
                    <input
                      type="text"
                      value={newImageUrl}
                      onChange={e => { setNewImageUrl(e.target.value); setPreviewUrl(e.target.value); }}
                      placeholder="https://..."
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs bg-white"
                    />
                  </div>

                  {previewUrl && (
                    <div className="flex items-center gap-3 p-2 bg-white rounded-xl border border-blue-200">
                      <img src={previewUrl} alt="Aperçu" className="w-14 h-14 rounded-lg object-cover border border-blue-500" />
                      <span className="text-xs text-emerald-700 font-bold">Photo prête à enregistrer</span>
                    </div>
                  )}

                  <label className="flex items-center gap-2 text-xs text-slate-700 cursor-pointer pt-1 font-medium">
                    <input type="checkbox" checked={replaceAllPhotos} onChange={e => setReplaceAllPhotos(e.target.checked)} />
                    Remplacer les anciennes photos
                  </label>

                  <button
                    type="button"
                    disabled={uploading || (!newImageUrl.trim() && !newImageFile)}
                    onClick={handleUploadPhoto}
                    className="btn-touch w-full py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-xs disabled:opacity-40 shadow-sm"
                  >
                    {uploading ? "Envoi en cours..." : "✓ Enregistrer cette photo"}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL ÉDITION COMPLÈTE DE L'ARTICLE */}
          {/* ======================================================== */}
          {editModalProd && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={() => setEditModalProd(null)}>
              <form onSubmit={handleSaveEditProduct} className="card w-full sm:max-w-xl p-5 sm:p-6 space-y-4 rounded-t-3xl sm:rounded-2xl max-h-[92vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-start border-b border-slate-100 pb-3">
                  <div>
                    <span className="text-[11px] font-bold text-blue-600 uppercase">Fiche Complète</span>
                    <h3 className="text-base sm:text-lg font-extrabold text-slate-900">{editModalProd.name}</h3>
                    <span className="font-mono text-xs text-slate-500">Réf : {editModalProd.reference}</span>
                  </div>
                  <button type="button" onClick={() => setEditModalProd(null)} className="p-2 text-slate-400 hover:text-slate-800 text-xl font-bold">✕</button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Nom sur le site</label>
                    <input value={editForm.name} onChange={e => setEditForm({ ...editForm, name: e.target.value })} className="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-semibold" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Catégorie</label>
                    <select value={editForm.category} onChange={e => setEditForm({ ...editForm, category: e.target.value })} className="w-full px-3 py-2.5 rounded-xl border border-slate-300 bg-white font-semibold">
                      {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Prix Détail (DA) *</label>
                    <input type="number" step="0.01" value={editForm.public_price} onChange={e => setEditForm({ ...editForm, public_price: e.target.value })} className="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-extrabold text-blue-700" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Prix Gros / Revendeur (DA)</label>
                    <input type="number" step="0.01" value={editForm.reseller_price} onChange={e => setEditForm({ ...editForm, reseller_price: e.target.value })} className="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-extrabold" />
                  </div>
                </div>

                <div className="text-xs">
                  <label className="font-bold text-slate-700 block mb-1">Description courte</label>
                  <input value={editForm.short_description} onChange={e => setEditForm({ ...editForm, short_description: e.target.value })} className="w-full px-3 py-2.5 rounded-xl border border-slate-300" />
                </div>

                <div className="flex flex-wrap gap-3 text-xs pt-1">
                  <label className="flex items-center gap-1.5 font-bold cursor-pointer">
                    <input type="checkbox" checked={editForm.is_active} onChange={e => setEditForm({ ...editForm, is_active: e.target.checked })} />
                    Publié sur le site
                  </label>
                  <label className="flex items-center gap-1.5 font-bold cursor-pointer">
                    <input type="checkbox" checked={editForm.is_featured} onChange={e => setEditForm({ ...editForm, is_featured: e.target.checked })} />
                    Produit Vedette
                  </label>
                </div>

                <div className="grid grid-cols-2 gap-2.5 pt-2 border-t border-slate-100">
                  <button type="button" onClick={() => setEditModalProd(null)} className="btn-touch py-3 rounded-xl border border-slate-300 text-slate-700 font-bold text-xs">
                    Annuler
                  </button>
                  <button type="submit" className="btn-touch py-3 rounded-xl bg-slate-900 text-white font-extrabold text-xs shadow-md">
                    ✓ Enregistrer
                  </button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<OwnerDashboardApp />);
  </script>
  {% endverbatim %}
</body>
</html>
