<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon Dashboard Privé — Gestion Produits & Photos | LOGISZ CCTV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
    .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04); }
    .btn-primary { background: #0f172a; color: #ffffff; transition: all 0.15s; }
    .btn-primary:hover { background: #1e293b; }
    .btn-blue { background: #2563eb; color: #ffffff; transition: all 0.15s; }
    .btn-blue:hover { background: #1d4ed8; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  {% verbatim %}
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const API_BASE = "/api/v1";

    function fmtMoney(val) {
      const n = Number(val || 0);
      return n.toLocaleString("fr-DZ", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " DA";
    }

    function OwnerDashboardApp() {
      const [token, setToken] = useState(() => localStorage.getItem("cctv_jwt") || "");
      const [profile, setProfile] = useState(null);
      const [authChecked, setAuthChecked] = useState(false);
      const [loginForm, setLoginForm] = useState({ username: "admin", password: "admin123" });

      const [section, setSection] = useState("products"); // products, orders, accounts
      const [products, setProducts] = useState([]);
      const [categories, setCategories] = useState([]);
      const [stats, setStats] = useState(null);
      const [accounts, setAccounts] = useState([]);
      const [loading, setLoading] = useState(false);
      const [toast, setToast] = useState(null);

      // Filters
      const [searchQ, setSearchQ] = useState("");
      const [filterVis, setFilterVis] = useState("all"); // all, active, hidden
      const [filterPhoto, setFilterPhoto] = useState("all"); // all, with_photo, no_photo
      const [filterCat, setFilterCat] = useState("all");
      const [selectedIds, setSelectedIds] = useState([]);

      // Photo Gallery Modal
      const [photoModalProd, setPhotoModalProd] = useState(null);
      const [newImageUrl, setNewImageUrl] = useState("");
      const [newImageFile, setNewImageFile] = useState(null);
      const [previewUrl, setPreviewUrl] = useState("");
      const [replaceAllPhotos, setReplaceAllPhotos] = useState(false);
      const [uploading, setUploading] = useState(false);

      // Edit Product Info & Prices Modal
      const [editModalProd, setEditModalProd] = useState(null);
      const [editForm, setEditForm] = useState({});
      const [storeData, setStoreData] = useState({ photos: [], store: {} });
      const [storeUploading, setStoreUploading] = useState(false);

      const showToast = (msg, type = "success") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      const authHeaders = useMemo(() => {
        const h = { "Content-Type": "application/json" };
        if (token) h["Authorization"] = `Bearer ${token}`;
        return h;
      }, [token]);

      const checkAuthAndLoad = async () => {
        if (!token) {
          setProfile(null);
          setAuthChecked(true);
          return;
        }
        try {
          const res = await fetch(`${API_BASE}/auth/me/`, { headers: authHeaders });
          if (res.ok) {
            const d = await res.json();
            if (d.profile && d.profile.is_admin) {
              setProfile(d.profile);
              await loadAllData();
            } else {
              setProfile(null);
              showToast("Accès réservé uniquement au propriétaire (Admin).", "error");
            }
          } else {
            localStorage.removeItem("cctv_jwt");
            setToken("");
            setProfile(null);
          }
        } catch (e) {
        } finally {
          setAuthChecked(true);
        }
      };

      const loadAllData = async () => {
        setLoading(true);
        try {
          const [rProds, rHome, rStats, rAcc] = await Promise.all([
            fetch(`${API_BASE}/admin/products/?limit=600`, { headers: authHeaders }),
            fetch(`${API_BASE}/catalog/home/`, { headers: authHeaders }),
            fetch(`${API_BASE}/admin/dashboard/`, { headers: authHeaders }),
            fetch(`${API_BASE}/admin/accounts/`, { headers: authHeaders })
          ]);
          if (rProds.ok) {
            const prodsList = await rProds.json();
            setProducts(prodsList);
            if (photoModalProd) {
              const updated = prodsList.find(x => x.id === photoModalProd.id);
              if (updated) setPhotoModalProd(updated);
            }
          }
          if (rHome.ok) {
            const h = await rHome.json();
            setCategories(h.categories || []);
          }
          if (rStats.ok) setStats(await rStats.json());
          if (rAcc.ok) setAccounts(await rAcc.json());
          try {
            const rStore = await fetch(`${API_BASE}/store/photos/`);
            if (rStore.ok) setStoreData(await rStore.json());
          } catch (e) {}
        } catch (e) {
          showToast("Erreur lors du chargement des données", "error");
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        checkAuthAndLoad();
      }, [token]);

      const handleUploadStorePhoto = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        setStoreUploading(true);
        try {
          const reader = new FileReader();
          const b64 = await new Promise((resolve) => {
            reader.onload = (ev) => resolve(ev.target.result);
            reader.readAsDataURL(file);
          });
          const res = await fetch(`${API_BASE}/store/photos/`, {
            method: "POST",
            headers: authHeaders,
            body: JSON.stringify({ image_base64: b64 })
          });
          if (res.ok) {
            showToast("Photo du magasin ajoutée avec succès !", "success");
            const rStore = await fetch(`${API_BASE}/store/photos/`);
            if (rStore.ok) setStoreData(await rStore.json());
          } else {
            showToast("Erreur lors de l'ajout de la photo", "error");
          }
        } catch (err) {
          showToast("Erreur de connexion", "error");
        } finally {
          setStoreUploading(false);
        }
      };

      const handleDeleteStorePhoto = async (photoUrl) => {
        if (!confirm("Voulez-vous supprimer cette photo du magasin ?")) return;
        try {
          const res = await fetch(`${API_BASE}/store/photos/`, {
            method: "DELETE",
            headers: authHeaders,
            body: JSON.stringify({ url: photoUrl })
          });
          if (res.ok) {
            showToast("Photo supprimée", "success");
            const rStore = await fetch(`${API_BASE}/store/photos/`);
            if (rStore.ok) setStoreData(await rStore.json());
          } else {
            showToast("Erreur de suppression", "error");
          }
        } catch (err) {
          showToast("Erreur de connexion", "error");
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        const res = await fetch(`${API_BASE}/auth/login/`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(loginForm)
        });
        const data = await res.json();
        if (res.ok) {
          if (!data.profile.is_admin) {
            showToast("Ce compte n'est pas administrateur.", "error");
            return;
          }
          localStorage.setItem("cctv_jwt", data.access);
          setToken(data.access);
          setProfile(data.profile);
          showToast("Bienvenue dans votre espace privé !", "success");
        } else {
          showToast(data.error || "Identifiants incorrects", "error");
        }
      };

      const updateProductField = async (prodId, fields, successMsg) => {
        const res = await fetch(`${API_BASE}/admin/products/${prodId}/`, {
          method: "PUT",
          headers: authHeaders,
          body: JSON.stringify(fields)
        });
        if (res.ok) {
          const updated = await res.json();
          setProducts(prev => prev.map(p => p.id === prodId ? updated : p));
          if (successMsg) showToast(successMsg, "success");
          return updated;
        } else {
          showToast("Erreur lors de la mise à jour", "error");
          return null;
        }
      };

      const handleBulkVisibility = async (makeActive) => {
        if (selectedIds.length === 0) return;
        setLoading(true);
        let okCount = 0;
        for (const id of selectedIds) {
          const res = await fetch(`${API_BASE}/admin/products/${id}/`, {
            method: "PUT",
            headers: authHeaders,
            body: JSON.stringify({ is_active: makeActive })
          });
          if (res.ok) okCount++;
        }
        setSelectedIds([]);
        await loadAllData();
        showToast(`${okCount} article(s) ${makeActive ? "partagés sur le site" : "masqués du site"}.`, "success");
      };

      const handleUploadPhoto = async () => {
        if (!photoModalProd) return;
        if (!newImageUrl.trim() && !newImageFile) {
          showToast("Sélectionnez une image sur votre PC ou collez une URL.", "error");
          return;
        }
        setUploading(true);
        try {
          let payload = { is_main: true, replace_all: replaceAllPhotos };
          if (newImageFile) {
            const reader = new FileReader();
            const b64 = await new Promise((resolve) => {
              reader.onload = (e) => resolve(e.target.result);
              reader.readAsDataURL(newImageFile);
            });
            payload.image_base64 = b64;
          } else {
            payload.image_url = newImageUrl.trim();
          }

          const res = await fetch(`${API_BASE}/admin/products/${photoModalProd.id}/images/`, {
            method: "POST",
            headers: authHeaders,
            body: JSON.stringify(payload)
          });
          const d = await res.json();
          if (res.ok) {
            showToast("Photo ajoutée et mise à jour !", "success");
            setNewImageUrl("");
            setNewImageFile(null);
            setPreviewUrl("");
            if (d.product) {
              setPhotoModalProd(d.product);
              setProducts(prev => prev.map(p => p.id === d.product.id ? d.product : p));
            }
          } else {
            showToast(d.error || "Erreur d'envoi", "error");
          }
        } catch (err) {
          showToast("Erreur de connexion", "error");
        } finally {
          setUploading(false);
        }
      };

      const handleSetMainImage = async (prodId, imageId) => {
        const res = await fetch(`${API_BASE}/admin/products/${prodId}/images/${imageId}/`, {
          method: "PATCH",
          headers: authHeaders,
          body: JSON.stringify({ is_main: true })
        });
        if (res.ok) {
          showToast("Photo principale modifiée", "success");
          await loadAllData();
        }
      };

      const handleDeleteImage = async (prodId, imageId) => {
        const res = await fetch(`${API_BASE}/admin/products/${prodId}/images/${imageId}/`, {
          method: "DELETE",
          headers: authHeaders
        });
        if (res.ok) {
          showToast("Photo supprimée", "success");
          await loadAllData();
        }
      };

      const openEditModal = (p) => {
        setEditModalProd(p);
        setEditForm({
          name: p.name || "",
          category: p.category || "",
          public_price: p.public_price || 0,
          promo_price: p.promo_price || "",
          installer_price: p.tier_prices?.installer_price ?? p.public_price,
          reseller_price: p.tier_prices?.reseller_price ?? p.public_price,
          short_description: p.short_description || "",
          description: p.description || "",
          warranty_months: p.warranty_months || 12,
          is_active: p.is_active,
          is_featured: p.is_featured,
          is_bestseller: p.is_bestseller,
          is_new_arrival: p.is_new_arrival,
          is_special_offer: p.is_special_offer
        });
      };

      const handleSaveEditProduct = async (e) => {
        e.preventDefault();
        const payload = {
          ...editForm,
          promo_price: editForm.promo_price === "" ? null : editForm.promo_price,
          category: editForm.category === "" ? null : editForm.category
        };
        const updated = await updateProductField(editModalProd.id, payload, "Article mis à jour avec succès !");
        if (updated) setEditModalProd(null);
      };

      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          if (searchQ.trim()) {
            const q = searchQ.toLowerCase();
            if (!(p.name || "").toLowerCase().includes(q) &&
                !(p.reference || "").toLowerCase().includes(q) &&
                !(p.brand_name || "").toLowerCase().includes(q)) return false;
          }
          if (filterVis === "active" && !p.is_active) return false;
          if (filterVis === "hidden" && p.is_active) return false;
          const hasImg = (p.images && p.images.length > 0) || (p.main_image && p.main_image.trim() !== "");
          if (filterPhoto === "with_photo" && !hasImg) return false;
          if (filterPhoto === "no_photo" && hasImg) return false;
          if (filterCat !== "all" && String(p.category) !== String(filterCat)) return false;
          return true;
        });
      }, [products, searchQ, filterVis, filterPhoto, filterCat]);

      const counts = useMemo(() => {
        const total = products.length;
        const active = products.filter(p => p.is_active).length;
        const hidden = total - active;
        const withPhoto = products.filter(p => (p.images && p.images.length > 0) || (p.main_image && p.main_image.trim() !== "")).length;
        return { total, active, hidden, withPhoto, noPhoto: total - withPhoto };
      }, [products]);

      if (!authChecked) {
        return <div className="min-h-screen flex items-center justify-center text-slate-400 text-sm">Chargement de votre espace privé...</div>;
      }

      // LOGIN SCREEN (ONLY FOR OWNER)
      if (!profile || !profile.is_admin) {
        return (
          <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
            <div className="card max-w-md w-full p-8 space-y-6">
              <div className="text-center space-y-2">
                <div className="w-12 h-12 rounded-2xl bg-slate-900 text-white flex items-center justify-center font-extrabold text-xl mx-auto">LZ</div>
                <h1 className="text-2xl font-extrabold text-slate-900">Mon Dashboard Privé</h1>
                <p className="text-xs text-slate-500">Connectez-vous avec votre compte Administrateur pour gérer les produits publiés et les photos du site.</p>
              </div>
              {toast && (
                <div className={`p-3 rounded-xl text-xs font-medium ${toast.type === "error" ? "bg-red-50 text-red-700 border border-red-200" : "bg-emerald-50 text-emerald-700 border border-emerald-200"}`}>
                  {toast.msg}
                </div>
              )}
              <div className="p-3 rounded-xl bg-blue-50 border border-blue-200 text-xs text-blue-900 space-y-1">
                <div className="font-bold flex items-center gap-1.5 text-blue-700">
                  <span>🔑</span> Identifiants Administrateur :
                </div>
                <div>Nom d'utilisateur : <strong className="font-mono text-slate-900">admin</strong></div>
                <div>Mot de passe : <strong className="font-mono text-slate-900">admin123</strong></div>
              </div>
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="text-xs font-semibold text-slate-600 block mb-1">Nom d'utilisateur</label>
                  <input
                    required
                    value={loginForm.username}
                    onChange={e => setLoginForm({ ...loginForm, username: e.target.value })}
                    className="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-blue-600"
                  />
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-600 block mb-1">Mot de passe</label>
                  <input
                    required
                    type="password"
                    placeholder="••••••••"
                    value={loginForm.password}
                    onChange={e => setLoginForm({ ...loginForm, password: e.target.value })}
                    className="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-blue-600"
                  />
                </div>
                <button type="submit" className="w-full py-3 rounded-xl btn-primary font-bold text-sm">
                  Accéder à mon Dashboard
                </button>
              </form>
              <div className="text-center pt-2 border-t border-slate-100">
                <a href="/" className="text-xs text-blue-600 hover:underline font-medium">← Retourner sur le site public</a>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          {/* HEADER */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-slate-900 text-white flex items-center justify-center font-extrabold text-sm">LZ</div>
                <div>
                  <h1 className="font-extrabold text-base text-slate-900">Mon Dashboard Privé — Gestion Produits & Photos</h1>
                  <p className="text-xs text-slate-500">Connecté en tant que <strong>{profile.username}</strong> • Contrôle complet du catalogue partagé</p>
                </div>
              </div>
              <div className="flex items-center gap-2.5">
                <a href="/" className="px-4 py-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold">
                  🌐 Voir mon Site Client
                </a>
                <button onClick={loadAllData} className="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-semibold">
                  ↻ Actualiser
                </button>
                <button
                  onClick={() => { localStorage.removeItem("cctv_jwt"); setToken(""); setProfile(null); }}
                  className="px-3.5 py-2 rounded-xl border border-red-200 text-red-600 hover:bg-red-50 text-xs font-semibold"
                >
                  Déconnexion
                </button>
              </div>
            </div>
          </header>

          {/* TOAST */}
          {toast && (
            <div className={`fixed bottom-6 right-6 z-50 px-5 py-3 rounded-xl shadow-lg border text-sm font-medium bg-white ${
              toast.type === "error" ? "border-red-300 text-red-700" : "border-emerald-300 text-emerald-700"
            }`}>
              {toast.type === "error" ? "✕ " : "✓ "}{toast.msg}
            </div>
          )}

          <main className="max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">
            {/* KPI CARDS */}
            <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
              <div className="card p-4">
                <div className="text-xs text-slate-500 font-medium">Total Stock LOGISZ</div>
                <div className="text-2xl font-extrabold text-slate-900 mt-1">{counts.total}</div>
              </div>
              <div className="card p-4 cursor-pointer hover:border-emerald-300" onClick={() => setFilterVis("active")}>
                <div className="text-xs text-slate-500 font-medium">Partagés sur le Site</div>
                <div className="text-2xl font-extrabold text-emerald-600 mt-1">{counts.active}</div>
              </div>
              <div className="card p-4 cursor-pointer hover:border-slate-400" onClick={() => setFilterVis("hidden")}>
                <div className="text-xs text-slate-500 font-medium">Masqués (Privés)</div>
                <div className="text-2xl font-extrabold text-slate-500 mt-1">{counts.hidden}</div>
              </div>
              <div className="card p-4 cursor-pointer hover:border-blue-300" onClick={() => setFilterPhoto("with_photo")}>
                <div className="text-xs text-slate-500 font-medium">Avec Photo Personnalisée</div>
                <div className="text-2xl font-extrabold text-blue-600 mt-1">{counts.withPhoto}</div>
              </div>
              <div className="card p-4 cursor-pointer hover:border-amber-300" onClick={() => setFilterPhoto("no_photo")}>
                <div className="text-xs text-slate-500 font-medium">Sans Photo</div>
                <div className="text-2xl font-extrabold text-amber-600 mt-1">{counts.noPhoto}</div>
              </div>
            </div>

            {/* NAVIGATION TABS */}
            <div className="flex gap-2 border-b border-slate-200 pb-3">
              <button
                onClick={() => setSection("products")}
                className={`px-4 py-2 rounded-xl text-sm font-bold ${section === "products" ? "bg-slate-900 text-white" : "bg-white border border-slate-200 text-slate-600 hover:bg-slate-100"}`}
              >
                📦 Produits partagés & Photos ({counts.total})
              </button>
              <button
                onClick={() => setSection("orders")}
                className={`px-4 py-2 rounded-xl text-sm font-bold ${section === "orders" ? "bg-slate-900 text-white" : "bg-white border border-slate-200 text-slate-600 hover:bg-slate-100"}`}
              >
                🛒 Commandes Web ({stats?.kpis?.total_orders || 0})
              </button>
              <button
                onClick={() => setSection("accounts")}
                className={`px-4 py-2 rounded-xl text-sm font-bold ${section === "accounts" ? "bg-slate-900 text-white" : "bg-white border border-slate-200 text-slate-600 hover:bg-slate-100"}`}
              >
                👥 Comptes Pro ({(stats?.kpis?.pending_installers || 0) + (stats?.kpis?.pending_resellers || 0)} en attente)
              </button>
              <button
                onClick={() => setSection("store")}
                className={`px-4 py-2 rounded-xl text-sm font-bold ${section === "store" ? "bg-slate-900 text-white" : "bg-white border border-slate-200 text-slate-600 hover:bg-slate-100"}`}
              >
                🏬 Photos du Magasin ({storeData.photos.length})
              </button>
            </div>

            {/* ==================== SECTION 1: PRODUCTS & PHOTOS ==================== */}
            {section === "products" && (
              <div className="space-y-4">
                {/* FILTERS & BULK ACTIONS */}
                <div className="card p-4 flex flex-wrap items-center justify-between gap-3">
                  <div className="flex flex-wrap items-center gap-2.5 flex-1">
                    <input
                      type="text"
                      value={searchQ}
                      onChange={e => setSearchQ(e.target.value)}
                      placeholder="Rechercher par nom, référence ou marque..."
                      className="px-3.5 py-2 rounded-xl border border-slate-300 text-sm w-72 focus:outline-none focus:border-blue-600"
                    />
                    <select value={filterVis} onChange={e => setFilterVis(e.target.value)} className="px-3 py-2 rounded-xl border border-slate-300 text-sm bg-white">
                      <option value="all">Visibilité : Tous</option>
                      <option value="active">✓ Publiés sur le site</option>
                      <option value="hidden">✕ Masqués du site</option>
                    </select>
                    <select value={filterPhoto} onChange={e => setFilterPhoto(e.target.value)} className="px-3 py-2 rounded-xl border border-slate-300 text-sm bg-white">
                      <option value="all">Photos : Toutes</option>
                      <option value="with_photo">📷 Avec photo ajoutée</option>
                      <option value="no_photo">⚠ Sans photo</option>
                    </select>
                    <select value={filterCat} onChange={e => setFilterCat(e.target.value)} className="px-3 py-2 rounded-xl border border-slate-300 text-sm bg-white">
                      <option value="all">Toutes les catégories</option>
                      {categories.map(c => (
                        <option key={c.id} value={c.id}>{c.name}</option>
                      ))}
                    </select>
                  </div>

                  {selectedIds.length > 0 && (
                    <div className="flex items-center gap-2 bg-blue-50 px-3 py-1.5 rounded-xl border border-blue-200">
                      <span className="text-xs font-bold text-blue-800">{selectedIds.length} sélectionné(s)</span>

                <div className="text-xs">
                  <label className="font-semibold text-slate-600 block mb-1">Description détaillée</label>
                  <textarea rows={3} value={editForm.description} onChange={e => setEditForm({ ...editForm, description: e.target.value })} className="w-full px-3 py-2 rounded-lg border border-slate-300" />
                </div>

                <div className="flex flex-wrap gap-4 text-xs pt-1">
                  <label className="flex items-center gap-1.5 font-semibold cursor-pointer">
                    <input type="checkbox" checked={editForm.is_active} onChange={e => setEditForm({ ...editForm, is_active: e.target.checked })} />
                    Partagé sur le site
                  </label>
                  <label className="flex items-center gap-1.5 font-semibold cursor-pointer">
                    <input type="checkbox" checked={editForm.is_featured} onChange={e => setEditForm({ ...editForm, is_featured: e.target.checked })} />
                    Produit Vedette
                  </label>
                  <label className="flex items-center gap-1.5 font-semibold cursor-pointer">
                    <input type="checkbox" checked={editForm.is_new_arrival} onChange={e => setEditForm({ ...editForm, is_new_arrival: e.target.checked })} />
                    Nouveauté
                  </label>
                  <label className="flex items-center gap-1.5 font-semibold cursor-pointer">
                    <input type="checkbox" checked={editForm.is_special_offer} onChange={e => setEditForm({ ...editForm, is_special_offer: e.target.checked })} />
                    Offre Spéciale
                  </label>
                </div>

                <div className="flex gap-3 pt-2 border-t border-slate-100">
                  <button type="button" onClick={() => setEditModalProd(null)} className="flex-1 py-2.5 rounded-xl border border-slate-300 text-slate-700 font-semibold text-xs">
                    Annuler
                  </button>
                  <button type="submit" className="flex-1 py-2.5 rounded-xl btn-primary font-bold text-xs">
                    ✓ Enregistrer les modifications
                  </button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<OwnerDashboardApp />);
  </script>
  {% endverbatim %}
</body>
</html>
