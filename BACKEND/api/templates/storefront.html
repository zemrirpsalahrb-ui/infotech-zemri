    .card-light { background: #ffffff; border: 1px solid #e2e8f0; transition: all 0.22s ease; }
    .card-light:hover { border-color: #cbd5e1; box-shadow: 0 12px 30px -10px rgba(15, 23, 42, 0.10); }
    /* 3D tilt cards */
    .tilt-wrap { perspective: 1000px; }
    .tilt { transform-style: preserve-3d; transition: transform .18s ease-out, box-shadow .25s ease; will-change: transform; }
    .tilt:hover { box-shadow: 0 30px 60px -20px rgba(30, 64, 175, .28); }
    .tilt .pop { transform: translateZ(40px); }
    .tilt .pop-sm { transform: translateZ(22px); }
    .shine { position:absolute; inset:0; pointer-events:none; background: radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.55), transparent 45%); opacity:0; transition: opacity .25s; mix-blend-mode: soft-light; }
    .tilt:hover .shine { opacity:1; }
    /* reveal on scroll */
    .reveal { opacity: 0; transform: translateY(40px) scale(.98); transition: opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1); }
    .reveal.in { opacity: 1; transform: none; }
    /* hero */
    .hero-bg { background: radial-gradient(1200px 600px at 80% 20%, rgba(59,130,246,.16), transparent 60%), radial-gradient(900px 500px at 10% 90%, rgba(14,165,233,.12), transparent 60%), linear-gradient(180deg,#ffffff, #f1f5f9); }
    .grid-floor { background-image: linear-gradient(rgba(37,99,235,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(37,99,235,.08) 1px, transparent 1px); background-size: 44px 44px; mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%); }
    .text-gradient { background: linear-gradient(90deg,#1d4ed8,#0ea5e9,#1d4ed8); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 6s linear infinite; }
    @keyframes shimmer { to { background-position: 200% center; } }
    @keyframes floaty { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    .floaty { animation: floaty 5s ease-in-out infinite; }
    @keyframes marquee { from { transform: translateX(0) } to { transform: translateX(-50%) } }
    .marquee { animation: marquee 28s linear infinite; }
    @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.55) } 100% { box-shadow: 0 0 0 18px rgba(34,197,94,0) } }
    .wa-pulse { animation: pulse-ring 1.8s infinite; }
    @keyframes rec { 0%,100% { opacity: 1 } 50% { opacity: .2 } }
    .rec-dot { animation: rec 1.2s infinite; }
    @keyframes modalIn { from { opacity: 0; transform: perspective(900px) rotateX(12deg) translateY(30px) scale(.96) } to { opacity: 1; transform: none } }
    @keyframes bump { 0% { transform: scale(1) } 40% { transform: scale(1.45) } 100% { transform: scale(1) } }
    .bump { display:inline-block; animation: bump .45s ease; }
    .cube-scene { perspective: 900px; }
    .cube { transform-style: preserve-3d; animation: spin 18s linear infinite; }
    @keyframes spin { from { transform: rotateX(-18deg) rotateY(0) } to { transform: rotateX(-18deg) rotateY(360deg) } }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f8fafc; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    @media (prefers-reduced-motion: reduce) { .reveal { opacity:1; transform:none } .marquee,.cube,.floaty { animation: none } }

      useEffect(() => {
        if (!products || products.length === 0) return;
        try {
          const params = new URLSearchParams(window.location.search);
          const targetRef = params.get("ref") || params.get("p") || params.get("product") || params.get("item") || params.get("sku");
          const doBuy = params.get("buy") || params.get("order") || params.get("commander");
          
          if (targetRef) {
            const q = targetRef.trim().toLowerCase();
            const found = products.find(p => 
              String(p.id) === q || 
              String(p.reference || "").toLowerCase() === q ||
              String(p.name || "").toLowerCase() === q ||
              String(p.reference || "").toLowerCase().includes(q)
            );
            if (found) {
              if (doBuy) {
                addToCart(found, 1);
                setTab("cart");
                showToast(`⚡ Produit « ${found.name} » ajouté au panier !`, "success");

                setSelectedProduct(found);
                showToast(`Caméra sélectionnée : « ${found.name} »`, "info");
              }
            }
          }
        } catch (e) {
          console.error("TikTok query param parsing error:", e);
        }
      }, [products]);

      const loadMe = async () => {
        if (!token) { setProfile(null); return; }

          const res = await fetch(`${API_BASE}/auth/me/`, { headers: authHeaders });

            const d = await res.json();

              customer_name: prev.customer_name || `${d.profile.first_name || ""} ${d.profile.last_name || ""}`.trim() || d.profile.username,

            }));

            setToken("");

          if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
        }), { threshold: 0.12 });
        document.querySelectorAll(".reveal:not(.in)").forEach(el => io.observe(el));
        return () => io.disconnect();
      });

      const addToCart = (product, qty = 1) => {
        setCart(prev => {
          const existing = prev.find(item => item.product.id === product.id);
          if (existing) {
            return prev.map(item => item.product.id === product.id ? { ...item, quantity: item.quantity + qty } : item);
          }
          return [...prev, { product, quantity: qty }];
        });
        showToast(`« ${product.name} » ajouté au panier (${fmtMoney(product.effective_price)})`, "success");

    function ProductCardItem({ p, onSelect, onAdd, isFav, onFav, inCompare, onCompare }) {
      const ref = React.useRef(null);
      const onMove = (e) => {
        const el = ref.current; if (!el) return;
        const r = el.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
        el.style.transform = `rotateY(${(x - 0.5) * 14}deg) rotateX(${(0.5 - y) * 14}deg) translateZ(0)`;
        el.style.setProperty("--mx", `${x * 100}%`); el.style.setProperty("--my", `${y * 100}%`);
      };
      const onLeave = () => { if (ref.current) ref.current.style.transform = ""; };
      return (
        <div className="tilt-wrap reveal">
          <div ref={ref} onMouseMove={onMove} onMouseLeave={onLeave} className="tilt relative bg-white border border-slate-200 rounded-3xl overflow-hidden flex flex-col justify-between h-full">
            <div className="shine"></div>
            <div onClick={onSelect} className="cursor-pointer">

    /* ---------- Compteur animé ---------- */
    function Counter({ to, label, suffix = "" }) {
      const [v, setV] = useState(0);
      useEffect(() => {
        let raf, start;
        const step = (t) => { start = start || t; const k = Math.min(1, (t - start) / 1400); setV(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1) raf = requestAnimationFrame(step); };
        raf = requestAnimationFrame(step); return () => cancelAnimationFrame(raf);
      }, [to]);
      return (
        <div className="p-3 rounded-2xl bg-white/80 backdrop-blur border border-slate-200 text-center">
          <div className="font-display text-2xl font-bold text-slate-900">{v}{suffix}</div>
          <div className="text-[11px] text-slate-500">{label}</div>
        </div>
      );
    }

    /* ---------- Scène 3D (Three.js) : caméra de surveillance qui suit la souris ---------- */
    function Hero3D() {
      const mount = React.useRef(null);
      useEffect(() => {
        const el = mount.current;
        if (!el || !window.THREE) return;
        const T = window.THREE;
        const W = () => el.clientWidth, H = () => el.clientHeight;
        const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(W(), H());
        renderer.shadowMap.enabled = true;
        el.appendChild(renderer.domElement);
        const scene = new T.Scene();
        const cam = new T.PerspectiveCamera(38, W() / H(), 0.1, 100);
        cam.position.set(0, 1.2, 9);

        scene.add(new T.HemisphereLight(0xffffff, 0xcbd5e1, 0.9));
        const key = new T.DirectionalLight(0xffffff, 1.1); key.position.set(4, 6, 5); key.castShadow = true; scene.add(key);
        const rim = new T.PointLight(0x3b82f6, 2.2, 20); rim.position.set(-4, 2, -2); scene.add(rim);

        const white = new T.MeshStandardMaterial({ color: 0xf8fafc, metalness: 0.25, roughness: 0.35 });
        const dark = new T.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.6, roughness: 0.25 });
        const glass = new T.MeshPhysicalMaterial({ color: 0x1e3a8a, metalness: 0.1, roughness: 0.05, transmission: 0.2, clearcoat: 1, opacity: 0.95, transparent: true });

        // ---- Caméra bullet ----
        const rig = new T.Group(); scene.add(rig);
        const wall = new T.Mesh(new T.CylinderGeometry(0.55, 0.55, 0.18, 48), white); wall.rotation.x = Math.PI / 2; wall.position.set(0, 1.6, -1.6); rig.add(wall);
        const arm = new T.Mesh(new T.CylinderGeometry(0.12, 0.12, 1.3, 24), white); arm.rotation.x = Math.PI / 2; arm.position.set(0, 1.6, -0.95); rig.add(arm);
        const joint = new T.Mesh(new T.SphereGeometry(0.22, 32, 32), white); joint.position.set(0, 1.6, -0.3); rig.add(joint);
        const head = new T.Group(); head.position.set(0, 1.6, -0.3); rig.add(head);
        const body = new T.Mesh(new T.CylinderGeometry(0.62, 0.62, 2.6, 64), white); body.rotation.x = Math.PI / 2; body.position.set(0, -0.25, 1.1); head.add(body);
        const visor = new T.Mesh(new T.CylinderGeometry(0.72, 0.72, 2.0, 64, 1, true, Math.PI * 1.15, Math.PI * 0.7), white);
        visor.material = white.clone(); visor.material.side = T.DoubleSide; visor.rotation.x = Math.PI / 2; visor.rotation.y = Math.PI; visor.position.set(0, -0.2, 1.6); head.add(visor);
        const face = new T.Mesh(new T.CircleGeometry(0.6, 64), dark); face.position.set(0, -0.25, 2.41); head.add(face);
        const lens = new T.Mesh(new T.SphereGeometry(0.26, 48, 48), glass); lens.scale.z = 0.45; lens.position.set(0, -0.25, 2.43); head.add(lens);
        const ring = new T.Mesh(new T.TorusGeometry(0.33, 0.035, 16, 64), new T.MeshStandardMaterial({ color: 0x60a5fa, emissive: 0x2563eb, emissiveIntensity: 1.6 })); ring.position.set(0, -0.25, 2.44); head.add(ring);
        for (let i = 0; i < 6; i++) { // LEDs IR
          const a = (i / 6) * Math.PI * 2;
          const led = new T.Mesh(new T.SphereGeometry(0.045, 16, 16), new T.MeshStandardMaterial({ color: 0x7f1d1d, emissive: 0xef4444, emissiveIntensity: 0.9 }));
          led.position.set(Math.cos(a) * 0.48, -0.25 + Math.sin(a) * 0.48, 2.42); head.add(led);
        }
        const logo = new T.Mesh(new T.BoxGeometry(0.5, 0.06, 0.01), new T.MeshStandardMaterial({ color: 0x1d4ed8 })); logo.position.set(0, 0.38, 1.6); logo.rotation.x = -0.15; head.add(logo);
        // cône de vision
        const cone = new T.Mesh(new T.ConeGeometry(2.2, 7, 48, 1, true), new T.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.08, side: T.DoubleSide, depthWrite: false }));
        cone.rotation.x = -Math.PI / 2; cone.position.set(0, -0.25, 5.9); head.add(cone);
        rig.position.set(0.3, -0.6, 0); rig.rotation.y = -0.5;

        // ---- Caméra dôme flottante ----
        const dome = new T.Group(); dome.position.set(-2.4, -1.4, 0.5); scene.add(dome);
        const dbase = new T.Mesh(new T.CylinderGeometry(0.75, 0.8, 0.25, 64), white); dome.add(dbase);
        const dglass = new T.Mesh(new T.SphereGeometry(0.6, 64, 32, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), glass); dglass.position.y = -0.12; dome.add(dglass);
        const deye = new T.Mesh(new T.SphereGeometry(0.22, 32, 32), dark); deye.position.set(0, -0.35, 0.25); dome.add(deye);
        dome.rotation.x = Math.PI; dome.scale.setScalar(0.85);

        // ---- Particules ----
        const pg = new T.BufferGeometry(); const N = 380; const pos = new Float32Array(N * 3);
        for (let i = 0; i < N; i++) { pos[i * 3] = (Math.random() - 0.5) * 16; pos[i * 3 + 1] = (Math.random() - 0.5) * 9; pos[i * 3 + 2] = (Math.random() - 0.5) * 8 - 2; }
        pg.setAttribute("position", new T.BufferAttribute(pos, 3));
        const pts = new T.Points(pg, new T.PointsMaterial({ color: 0x3b82f6, size: 0.04, transparent: true, opacity: 0.55 }));
        scene.add(pts);
        // sol ombre
        const ground = new T.Mesh(new T.PlaneGeometry(30, 30), new T.ShadowMaterial({ opacity: 0.12 })); ground.rotation.x = -Math.PI / 2; ground.position.y = -2.6; ground.receiveShadow = true; scene.add(ground);
        [body, visor, joint, arm, dbase].forEach(m => m.castShadow = true);

        let mx = 0, my = 0;
        const onMove = (e) => { mx = (e.clientX / window.innerWidth) * 2 - 1; my = (e.clientY / window.innerHeight) * 2 - 1; };
        window.addEventListener("mousemove", onMove);
        const onResize = () => { renderer.setSize(W(), H()); cam.aspect = W() / H(); cam.updateProjectionMatrix(); };
        window.addEventListener("resize", onResize);

        let raf; const clock = new T.Clock();
        const loop = () => {
          const t = clock.getElapsedTime();
          const auto = Math.sin(t * 0.6) * 0.25;
          head.rotation.y += ((mx * 0.9 + auto) - head.rotation.y) * 0.06;
          head.rotation.x += ((my * 0.35) - head.rotation.x) * 0.06;
          rig.position.y = -0.6 + Math.sin(t * 1.2) * 0.08;
          dome.position.y = -1.4 + Math.sin(t * 1.5 + 1) * 0.12; dome.rotation.y = t * 0.5;
          ring.material.emissiveIntensity = 1.2 + Math.sin(t * 3) * 0.6;
          cone.material.opacity = 0.06 + (Math.sin(t * 2) + 1) * 0.03;
          pts.rotation.y = t * 0.03;
          renderer.render(scene, cam);
          raf = requestAnimationFrame(loop);
        };
        loop();
        return () => { cancelAnimationFrame(raf); window.removeEventListener("mousemove", onMove); window.removeEventListener("resize", onResize); renderer.dispose(); el.innerHTML = ""; };
      }, []);
      return <div ref={mount} className="absolute inset-0" />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  {% endverbatim %}
</body>
