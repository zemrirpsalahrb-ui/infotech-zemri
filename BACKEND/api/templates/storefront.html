<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOGISZ SECURITY — Équipements CCTV & Vidéosurveillance Professionnelle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #0f172a; }
    .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; letter-spacing: -0.02em; }
    .glass-light { background: rgba(255, 255, 255, 0.78); backdrop-filter: blur(16px) saturate(160%); border-bottom: 1px solid rgba(226,232,240,.8); }
    .card-light { background: #ffffff; border: 1px solid #e2e8f0; transition: all 0.22s ease; }
    .card-light:hover { border-color: #cbd5e1; box-shadow: 0 12px 30px -10px rgba(15, 23, 42, 0.10); }
    /* 3D tilt cards */
    .tilt-wrap { perspective: 1000px; }
    .tilt { transform-style: preserve-3d; transition: transform .18s ease-out, box-shadow .25s ease; will-change: transform; }
    .tilt:hover { box-shadow: 0 30px 60px -20px rgba(30, 64, 175, .28); }
    .tilt .pop { transform: translateZ(40px); }
    .tilt .pop-sm { transform: translateZ(22px); }
    .shine { position:absolute; inset:0; pointer-events:none; background: radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.55), transparent 45%); opacity:0; transition: opacity .25s; mix-blend-mode: soft-light; }
    .tilt:hover .shine { opacity:1; }
    /* reveal on scroll */
    .reveal { opacity: 0; transform: translateY(40px) scale(.98); transition: opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1); }
    .reveal.in { opacity: 1; transform: none; }
    /* hero */
    .hero-bg { background: radial-gradient(1200px 600px at 80% 20%, rgba(59,130,246,.16), transparent 60%), radial-gradient(900px 500px at 10% 90%, rgba(14,165,233,.12), transparent 60%), linear-gradient(180deg,#ffffff, #f1f5f9); }
    .grid-floor { background-image: linear-gradient(rgba(37,99,235,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(37,99,235,.08) 1px, transparent 1px); background-size: 44px 44px; mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%); }
    .text-gradient { background: linear-gradient(90deg,#1d4ed8,#0ea5e9,#1d4ed8); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 6s linear infinite; }
    @keyframes shimmer { to { background-position: 200% center; } }
    @keyframes floaty { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    .floaty { animation: floaty 5s ease-in-out infinite; }
    @keyframes marquee { from { transform: translateX(0) } to { transform: translateX(-50%) } }
    .marquee { animation: marquee 28s linear infinite; }
    @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.55) } 100% { box-shadow: 0 0 0 18px rgba(34,197,94,0) } }
    .wa-pulse { animation: pulse-ring 1.8s infinite; }
    @keyframes rec { 0%,100% { opacity: 1 } 50% { opacity: .2 } }
    .rec-dot { animation: rec 1.2s infinite; }
    @keyframes modalIn { from { opacity: 0; transform: perspective(900px) rotateX(12deg) translateY(30px) scale(.96) } to { opacity: 1; transform: none } }
    @keyframes bump { 0% { transform: scale(1) } 40% { transform: scale(1.45) } 100% { transform: scale(1) } }
    .bump { display:inline-block; animation: bump .45s ease; }
    .cube-scene { perspective: 900px; }
    .cube { transform-style: preserve-3d; animation: spin 18s linear infinite; }
    @keyframes spin { from { transform: rotateX(-18deg) rotateY(0) } to { transform: rotateX(-18deg) rotateY(360deg) } }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f8fafc; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    @media (prefers-reduced-motion: reduce) { .reveal { opacity:1; transform:none } .marquee,.cube,.floaty { animation: none } }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-white text-slate-900">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  {% verbatim %}
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const API_BASE = "/api/v1";

    const DEFAULT_IMAGES = {
      "IP Cameras": "https://images.unsplash.com/photo-1557597774-9d273605dfa9?auto=format&fit=crop&w=700&q=80",
      "Wi-Fi Cameras": "https://images.unsplash.com/photo-1585771724684-38269d6639fd?auto=format&fit=crop&w=700&q=80",
      "Analog Cameras": "https://images.unsplash.com/photo-1558002038-1055907df827?auto=format&fit=crop&w=700&q=80",
      "PTZ Cameras": "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=700&q=80",
      "DVR": "https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=700&q=80",
      "NVR": "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?auto=format&fit=crop&w=700&q=80",
      "Surveillance Hard Drives": "https://images.unsplash.com/photo-1531492746076-161ca9bcad58?auto=format&fit=crop&w=700&q=80",
      "Power Supplies": "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=700&q=80",
      "default": "https://images.unsplash.com/photo-1557597774-9d273605dfa9?auto=format&fit=crop&w=700&q=80"
    };

    function getProductImg(p) {
      if (!p) return DEFAULT_IMAGES["default"];
      if (p.main_image && p.main_image.trim() !== "") return p.main_image;
      if (p.images && p.images.length > 0) return p.images[0].image_url;
      return DEFAULT_IMAGES[p.category_name] || DEFAULT_IMAGES["default"];
    }

    function fmtMoney(val) {
      const n = Number(val || 0);
      return n.toLocaleString("fr-DZ", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " DA";
    }

    function App() {
      const [tab, setTab] = useState("home"); // home, catalog, kit, cart, account
      const [token, setToken] = useState(() => localStorage.getItem("cctv_jwt") || "");
      const [profile, setProfile] = useState(null);
      const [homeData, setHomeData] = useState(null);
      const [products, setProducts] = useState([]);
      const [searchQ, setSearchQ] = useState("");
      const [selectedCat, setSelectedCat] = useState("all");
      const [onlyInStock, setOnlyInStock] = useState(false);
      const [sortBy, setSortBy] = useState("newest");
      const [selectedBrand, setSelectedBrand] = useState("all");
      const [priceMin, setPriceMin] = useState("");
      const [priceMax, setPriceMax] = useState("");
      const [visibleCount, setVisibleCount] = useState(24);
      const [compare, setCompare] = useState([]);
      const [showCompare, setShowCompare] = useState(false);
      const [favs, setFavs] = useState(() => { try { return JSON.parse(localStorage.getItem("cctv_favs") || "[]"); } catch { return []; } });
      const [onlyFavs, setOnlyFavs] = useState(false);
      const [mobileMenu, setMobileMenu] = useState(false);
      const [showTop, setShowTop] = useState(false);
      const [cart, setCart] = useState(() => {
        try { return JSON.parse(localStorage.getItem("cctv_cart") || "[]"); } catch { return []; }
      });
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [toast, setToast] = useState(null);

      // Kit Builder state
      const [kitData, setKitData] = useState(null);
      const [kitSelection, setKitSelection] = useState({});
      const [kitEval, setKitEval] = useState(null);

      // Checkout & Tracking state
      const [checkoutForm, setCheckoutForm] = useState({
        customer_name: "",
        customer_phone: "",
        customer_email: "",
        company_name: "",
        wilaya: "Alger",
        delivery_address: "",
        delivery_method: "DELIVERY",
        payment_method: "CASH_ON_DELIVERY",
        notes: ""
      });
      const [lastCreatedOrder, setLastCreatedOrder] = useState(null);
      const [trackUid, setTrackUid] = useState("");
      const [trackedOrder, setTrackedOrder] = useState(null);

      // Auth state
      const [authMode, setAuthMode] = useState("login");
      const [loginForm, setLoginForm] = useState({ username: "", password: "" });
      const [regForm, setRegForm] = useState({
        username: "", email: "", password: "", first_name: "", last_name: "",
        account_type: "INSTALLER", phone: "", company_name: "", wilaya: "Alger",
        rc_number: "", nif_number: "", professional_justification: ""
      });

      const showToast = (msg, type = "info") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      const authHeaders = useMemo(() => {
        const h = { "Content-Type": "application/json" };
        if (token) h["Authorization"] = `Bearer ${token}`;
        return h;
      }, [token]);

      const loadHomeAndProducts = async () => {
        try {
          const [resHome, resProds] = await Promise.all([
            fetch(`${API_BASE}/catalog/home/`, { headers: authHeaders }),
            fetch(`${API_BASE}/products/?limit=500`, { headers: authHeaders })
          ]);
          if (resHome.ok) setHomeData(await resHome.json());
          if (resProds.ok) {
            const d = await resProds.json();
            setProducts(d.results || []);
          }
        } catch (err) {
          console.error(err);
        }
      };

      const loadMe = async () => {
        if (!token) { setProfile(null); return; }
        try {
          const res = await fetch(`${API_BASE}/auth/me/`, { headers: authHeaders });
          if (res.ok) {
            const d = await res.json();
            setProfile(d.profile);
            setCheckoutForm(prev => ({
              ...prev,
              customer_name: prev.customer_name || `${d.profile.first_name || ""} ${d.profile.last_name || ""}`.trim() || d.profile.username,
              customer_phone: prev.customer_phone || d.profile.phone || "",
              customer_email: prev.customer_email || d.profile.email || "",
              company_name: prev.company_name || d.profile.company_name || "",
              wilaya: d.profile.wilaya || prev.wilaya
            }));
          } else {
            setToken("");
            localStorage.removeItem("cctv_jwt");
          }
        } catch (e) {}
      };

      useEffect(() => {
        loadHomeAndProducts();
        loadMe();
      }, [token]);

      useEffect(() => {
        localStorage.setItem("cctv_cart", JSON.stringify(cart));
      }, [cart]);

      // Animation d'apparition au défilement (3D reveal)
      useEffect(() => {
        const io = new IntersectionObserver(entries => entries.forEach(e => {
          if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
        }), { threshold: 0.12 });
        document.querySelectorAll(".reveal:not(.in)").forEach(el => io.observe(el));
        return () => io.disconnect();
      });

      const loadKitBuilder = async () => {
        const res = await fetch(`${API_BASE}/kit-builder/`, { headers: authHeaders });
        if (res.ok) setKitData(await res.json());
      };

      useEffect(() => {
        if (tab === "kit" && !kitData) loadKitBuilder();
      }, [tab]);

      const addToCart = (product, qty = 1) => {
        setCart(prev => {
          const existing = prev.find(item => item.product.id === product.id);
          if (existing) {
            return prev.map(item => item.product.id === product.id ? { ...item, quantity: item.quantity + qty } : item);
          }
          return [...prev, { product, quantity: qty }];
        });
        showToast(`« ${product.name} » ajouté au panier (${fmtMoney(product.effective_price)})`, "success");
      };

      const updateCartQty = (productId, qty) => {
        if (qty <= 0) setCart(prev => prev.filter(i => i.product.id !== productId));
        else setCart(prev => prev.map(i => i.product.id === productId ? { ...i, quantity: qty } : i));
      };

      const cartSubtotal = useMemo(() => {
        return cart.reduce((acc, item) => acc + Number(item.product.effective_price || 0) * item.quantity, 0);
      }, [cart]);

      // Marques propres (ignore les codes internes type "1", "B0"...) + fusion DAHUA / Dahua Technology
      const normBrand = (b) => {
        const s = String(b || "").trim();
        if (!s || s.length < 3 || /^[0-9A-Z]{1,2}[0-9]*$/.test(s) || /^\d+$/.test(s)) return "";
        if (/dahua/i.test(s)) return "Dahua";
        if (/western/i.test(s)) return "WD";
        return s;
      };
      const brandList = useMemo(() => {
        const m = {};
        products.forEach(p => { const b = normBrand(p.brand_name); if (b) m[b] = (m[b] || 0) + 1; });
        return Object.entries(m).filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]);
      }, [products]);

      const filteredProducts = useMemo(() => {
        let list = [...products];
        if (searchQ.trim()) {
          const words = searchQ.toLowerCase().split(/\s+/).filter(Boolean);
          list = list.filter(p => {
            const hay = `${p.name || ""} ${p.reference || ""} ${p.brand_name || ""} ${p.category_name || ""}`.toLowerCase();
            return words.every(w => hay.includes(w));
          });
        }
        if (selectedCat !== "all") {
          list = list.filter(p => String(p.category) === String(selectedCat) || p.category_slug === selectedCat || p.category_name === selectedCat);
        }
        if (selectedBrand !== "all") list = list.filter(p => normBrand(p.brand_name) === selectedBrand);
        if (priceMin !== "") list = list.filter(p => Number(p.effective_price) >= Number(priceMin));
        if (priceMax !== "") list = list.filter(p => Number(p.effective_price) <= Number(priceMax));
        if (onlyInStock) {
          list = list.filter(p => p.in_stock && p.available_stock > 0);
        }
        if (onlyFavs) list = list.filter(p => favs.includes(p.id));
        if (sortBy === "price_asc") list.sort((a, b) => a.effective_price - b.effective_price);
        if (sortBy === "price_desc") list.sort((a, b) => b.effective_price - a.effective_price);
        if (sortBy === "name") list.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
        if (sortBy === "stock") list.sort((a, b) => (b.available_stock || 0) - (a.available_stock || 0));
        return list;
      }, [products, searchQ, selectedCat, selectedBrand, priceMin, priceMax, onlyInStock, sortBy, onlyFavs, favs]);

      useEffect(() => { setVisibleCount(24); }, [searchQ, selectedCat, selectedBrand, priceMin, priceMax, onlyInStock, sortBy]);

      const resetFilters = () => { setSearchQ(""); setSelectedCat("all"); setSelectedBrand("all"); setPriceMin(""); setPriceMax(""); setOnlyInStock(false); setSortBy("newest"); };

      const toggleCompare = (p) => setCompare(prev => prev.find(x => x.id === p.id) ? prev.filter(x => x.id !== p.id) : (prev.length >= 4 ? (showToast("Maximum 4 produits à comparer", "error"), prev) : [...prev, p]));
      const toggleFav = (p) => setFavs(prev => prev.includes(p.id) ? prev.filter(id => id !== p.id) : [...prev, p.id]);
      useEffect(() => { localStorage.setItem("cctv_favs", JSON.stringify(favs)); }, [favs]);
      useEffect(() => {
        const onScroll = () => setShowTop(window.scrollY > 700);
        window.addEventListener("scroll", onScroll); return () => window.removeEventListener("scroll", onScroll);
      }, []);
      const goTab = (t) => { setTab(t); setMobileMenu(false); window.scrollTo({ top: 0, behavior: "smooth" }); };

      const handleLogin = async (e) => {
        e.preventDefault();
        const res = await fetch(`${API_BASE}/auth/login/`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(loginForm)
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem("cctv_jwt", data.access);
          setToken(data.access);
          setProfile(data.profile);
          showToast(`Bienvenue ${data.profile.username} ! Tarif actif : ${data.profile.effective_tier}`, "success");
        } else {
          showToast(data.error || "Identifiants invalides", "error");
        }
      };

      const handleRegister = async (e) => {
        e.preventDefault();
        const res = await fetch(`${API_BASE}/auth/register/`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(regForm)
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem("cctv_jwt", data.access);
          setToken(data.access);
          setProfile(data.profile);
          showToast(data.message, "success");
        } else {
          showToast(data.error || "Erreur lors de l'inscription", "error");
        }
      };

      const handleCheckout = async (e) => {
        e.preventDefault();
        if (cart.length === 0) return;
        const idemKey = "WEB-CHK-" + Date.now();
        const payload = {
          ...checkoutForm,
          idempotency_key: idemKey,
          items: cart.map(i => ({
            product_id: i.product.id,
            reference: i.product.reference,
            quantity: i.quantity
          }))
        };
        const res = await fetch(`${API_BASE}/orders/checkout/`, {
          method: "POST",
          headers: { ...authHeaders, "X-Idempotency-Key": idemKey },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          setLastCreatedOrder(data.order);
          setCart([]);
          showToast(`Commande ${data.order.order_uid} transmise au logiciel de caisse LOGISZ !`, "success");
          loadHomeAndProducts();
        } else {
          showToast(data.error || "Erreur lors de la validation de la commande", "error");
        }
      };

      const evaluateKit = async (newSelection) => {
        setKitSelection(newSelection);
        const items = Object.entries(newSelection)
          .filter(([_, v]) => v && v.qty > 0)
          .map(([_, v]) => ({ product_id: v.product.id, quantity: v.qty }));
        if (items.length === 0) { setKitEval(null); return; }
        const res = await fetch(`${API_BASE}/kit-builder/`, {
          method: "POST",
          headers: authHeaders,
          body: JSON.stringify({ items })
        });
        if (res.ok) setKitEval(await res.json());
      };

      const appliedTier = profile ? profile.effective_tier : (homeData ? homeData.applied_tier : "PUBLIC");
      const isAdmin = Boolean(profile && profile.is_admin);

      return (
        <div className="min-h-screen flex flex-col bg-slate-50/60">
          {/* TOP ANNOUNCEMENT BAR */}
          <div className="bg-slate-900 text-white text-xs py-2 px-4">
            <div className="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-2">
              <div className="flex flex-wrap items-center gap-3">
                <span className="inline-flex items-center gap-1.5 text-emerald-400 font-semibold">
                  ● Stock Synchronisé ({products.length} articles)
                </span>
                <a href="tel:0557882719" className="inline-flex items-center gap-1 text-white hover:text-blue-400 font-bold transition">
                  📞 0557 88 27 19
                </a>
                <a href="https://wa.me/213557882719" target="_blank" rel="noreferrer" className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 hover:bg-emerald-500/30 font-semibold transition">
                  💬 WhatsApp 0557 88 27 19
                </a>
                <a href="https://www.tiktok.com/@infotech.sz?is_from_webapp=1&sender_device=pc" target="_blank" rel="noreferrer" className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-white/10 hover:bg-white/20 text-white font-semibold transition">
                  🎵 TikTok @infotech.sz
                </a>
              </div>
              <div className="flex items-center gap-3">
                <span className="px-2.5 py-0.5 rounded-full bg-white/10 text-white font-semibold">
                  Tarif : {appliedTier === "RESELLER" ? "PRO Revendeur (Gros)" : appliedTier === "INSTALLER" ? "PRO Installateur" : "Public"}
                </span>
                {isAdmin && (
                  <a href="/mon-dashboard/" className="px-2.5 py-0.5 rounded-full bg-blue-600 hover:bg-blue-500 text-white font-bold">
                    ⚙ Mon Dashboard Privé
                  </a>
                )}
              </div>
            </div>
          </div>

          {/* NAVBAR */}
          <header className="sticky top-0 z-40 glass-light">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
              <div onClick={() => goTab("home")} className="flex items-center gap-3 cursor-pointer flex-shrink-0">
                <div className="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center font-extrabold text-lg shadow-sm">
                  LZ
                </div>
                <div className="hidden sm:block">
                  <div className="font-extrabold text-lg tracking-tight text-slate-900">
                    LOGISZ <span className="text-blue-600">CCTV</span>
                  </div>
                  <div className="text-[11px] text-slate-500">Vidéosurveillance & Sécurité Professionnelle</div>
                </div>
              </div>

              {/* Recherche globale avec suggestions */}
              <HeaderSearch products={products} onPick={(p) => setSelectedProduct(p)} onSubmit={(q) => { setSearchQ(q); goTab("catalog"); }} />

              <nav className="hidden lg:flex items-center gap-1.5">
                {[
                  { id: "home", label: "Accueil" },
                  { id: "catalog", label: "Catalogue" },
                  { id: "kit", label: "Kit CCTV" },
                  { id: "account", label: profile ? profile.username : "Espace Pro" },
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => goTab(item.id)}
                    className={`px-3.5 py-2 rounded-xl text-sm font-semibold transition ${
                      tab === item.id ? "bg-slate-900 text-white shadow-sm" : "text-slate-600 hover:bg-slate-100 hover:text-slate-900"
                    }`}
                  >
                    {item.label}
                  </button>
                ))}
                {isAdmin && (
                  <a href="/mon-dashboard/" className="px-3 py-2 rounded-xl text-sm font-bold bg-blue-50 text-blue-700 border border-blue-200 hover:bg-blue-100 transition" title="Mon Dashboard">⚙</a>
                )}
              </nav>
              <div className="flex items-center gap-2 flex-shrink-0">
                <button
                  onClick={() => goTab("cart")}
                  className="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm flex items-center gap-2 shadow-sm"
                >
                  <span>🛒</span>
                  <span key={cart.reduce((s, i) => s + i.quantity, 0)} className="px-2 py-0.5 text-xs rounded-full bg-white/20 bump">{cart.reduce((s, i) => s + i.quantity, 0)}</span>
                </button>
                <button onClick={() => setMobileMenu(v => !v)} className="lg:hidden w-10 h-10 rounded-xl border border-slate-200 bg-white text-slate-700 text-lg">☰</button>
              </div>
            </div>
            {mobileMenu && (
              <div className="lg:hidden border-t border-slate-200 bg-white px-4 py-3 grid grid-cols-2 gap-2">
                {[["home", "🏠 Accueil"], ["catalog", "📦 Catalogue"], ["kit", "🛠 Kit CCTV"], ["account", profile ? "👤 " + profile.username : "👤 Espace Pro"], ["cart", "🛒 Panier"]].map(([id, l]) => (

    function ProductCardItem({ p, onSelect, onAdd, isFav, onFav, inCompare, onCompare }) {
      const ref = React.useRef(null);
      const onMove = (e) => {
        const el = ref.current; if (!el) return;
        const r = el.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
        el.style.transform = `rotateY(${(x - 0.5) * 14}deg) rotateX(${(0.5 - y) * 14}deg) translateZ(0)`;
        el.style.setProperty("--mx", `${x * 100}%`); el.style.setProperty("--my", `${y * 100}%`);
      };
      const onLeave = () => { if (ref.current) ref.current.style.transform = ""; };
      return (
        <div className="tilt-wrap reveal">
          <div ref={ref} onMouseMove={onMove} onMouseLeave={onLeave} className="tilt relative bg-white border border-slate-200 rounded-3xl overflow-hidden flex flex-col justify-between h-full">
            <div className="shine"></div>
            <div onClick={onSelect} className="cursor-pointer">
              <div className="relative h-52 bg-gradient-to-b from-slate-50 to-white overflow-hidden flex items-center justify-center">

    /* ---------- Recherche dans l'en-tête avec suggestions instantanées ---------- */
    function HeaderSearch({ products, onPick, onSubmit }) {
      const [q, setQ] = useState("");
      const [open, setOpen] = useState(false);
      const hits = useMemo(() => {
        const words = q.toLowerCase().split(/\s+/).filter(Boolean);
        if (!words.length) return [];
        return products.filter(p => {
          const hay = `${p.name || ""} ${p.reference || ""} ${p.brand_name || ""}`.toLowerCase();
          return words.every(w => hay.includes(w));
        }).slice(0, 6);
      }, [q, products]);
      return (
        <form className="relative flex-1 max-w-md hidden md:block" onSubmit={e => { e.preventDefault(); if (q.trim()) { onSubmit(q.trim()); setOpen(false); } }}>
          <input value={q} onChange={e => { setQ(e.target.value); setOpen(true); }} onFocus={() => setOpen(true)} onBlur={() => setTimeout(() => setOpen(false), 180)}
            placeholder="🔍  Rechercher une caméra, un XVR, une référence..."
            className="w-full px-4 py-2.5 rounded-2xl bg-slate-100/80 border border-transparent focus:bg-white focus:border-blue-500 text-sm outline-none transition" />
          {open && hits.length > 0 && (
            <div className="absolute top-full mt-2 left-0 right-0 bg-white border border-slate-200 rounded-2xl shadow-2xl overflow-hidden z-50">
              {hits.map(p => (
                <button type="button" key={p.id} onMouseDown={() => { onPick(p); setQ(""); }} className="w-full flex items-center gap-3 px-3 py-2 hover:bg-slate-50 text-left">
                  <img src={getProductImg(p)} alt="" className="w-10 h-10 object-contain rounded-lg bg-slate-50" />
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-semibold text-slate-900 truncate">{p.name}</div>
                    <div className="text-[11px] text-slate-400 font-mono">{p.reference}</div>
                  </div>
                  <div className="text-xs font-bold text-blue-600 whitespace-nowrap">{fmtMoney(p.effective_price)}</div>
                </button>
              ))}
              <button type="submit" className="w-full px-3 py-2 text-xs font-semibold text-blue-600 bg-slate-50 hover:bg-slate-100">Voir tous les résultats pour « {q} » →</button>
            </div>
          )}
        </form>
      );
    }

    /* ---------- Compteur animé ---------- */
    function Counter({ to, label, suffix = "" }) {
      const [v, setV] = useState(0);
      useEffect(() => {
        let raf, start;
        const step = (t) => { start = start || t; const k = Math.min(1, (t - start) / 1400); setV(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1) raf = requestAnimationFrame(step); };
        raf = requestAnimationFrame(step); return () => cancelAnimationFrame(raf);
      }, [to]);
      return (
        <div className="p-3 rounded-2xl bg-white/80 backdrop-blur border border-slate-200 text-center">
          <div className="font-display text-2xl font-bold text-slate-900">{v}{suffix}</div>
          <div className="text-[11px] text-slate-500">{label}</div>
        </div>
      );
    }

    /* ---------- Scène 3D (Three.js) : caméra de surveillance qui suit la souris ---------- */
    function Hero3D() {
      const mount = React.useRef(null);
      useEffect(() => {
        const el = mount.current;
        if (!el || !window.THREE) return;
        const T = window.THREE;
        const W = () => el.clientWidth, H = () => el.clientHeight;
        const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(W(), H());
        renderer.shadowMap.enabled = true;
        el.appendChild(renderer.domElement);
        const scene = new T.Scene();
        const cam = new T.PerspectiveCamera(38, W() / H(), 0.1, 100);
        cam.position.set(0, 1.2, 9);

        scene.add(new T.HemisphereLight(0xffffff, 0xcbd5e1, 0.9));
        const key = new T.DirectionalLight(0xffffff, 1.1); key.position.set(4, 6, 5); key.castShadow = true; scene.add(key);
        const rim = new T.PointLight(0x3b82f6, 2.2, 20); rim.position.set(-4, 2, -2); scene.add(rim);

        const white = new T.MeshStandardMaterial({ color: 0xf8fafc, metalness: 0.25, roughness: 0.35 });
        const dark = new T.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.6, roughness: 0.25 });
        const glass = new T.MeshPhysicalMaterial({ color: 0x1e3a8a, metalness: 0.1, roughness: 0.05, transmission: 0.2, clearcoat: 1, opacity: 0.95, transparent: true });

        // ---- Caméra bullet ----
        const rig = new T.Group(); scene.add(rig);
        const wall = new T.Mesh(new T.CylinderGeometry(0.55, 0.55, 0.18, 48), white); wall.rotation.x = Math.PI / 2; wall.position.set(0, 1.6, -1.6); rig.add(wall);
        const arm = new T.Mesh(new T.CylinderGeometry(0.12, 0.12, 1.3, 24), white); arm.rotation.x = Math.PI / 2; arm.position.set(0, 1.6, -0.95); rig.add(arm);
        const joint = new T.Mesh(new T.SphereGeometry(0.22, 32, 32), white); joint.position.set(0, 1.6, -0.3); rig.add(joint);
        const head = new T.Group(); head.position.set(0, 1.6, -0.3); rig.add(head);
        const body = new T.Mesh(new T.CylinderGeometry(0.62, 0.62, 2.6, 64), white); body.rotation.x = Math.PI / 2; body.position.set(0, -0.25, 1.1); head.add(body);
        const visor = new T.Mesh(new T.CylinderGeometry(0.72, 0.72, 2.0, 64, 1, true, Math.PI * 1.15, Math.PI * 0.7), white);
        visor.material = white.clone(); visor.material.side = T.DoubleSide; visor.rotation.x = Math.PI / 2; visor.rotation.y = Math.PI; visor.position.set(0, -0.2, 1.6); head.add(visor);
        const face = new T.Mesh(new T.CircleGeometry(0.6, 64), dark); face.position.set(0, -0.25, 2.41); head.add(face);
        const lens = new T.Mesh(new T.SphereGeometry(0.26, 48, 48), glass); lens.scale.z = 0.45; lens.position.set(0, -0.25, 2.43); head.add(lens);
        const ring = new T.Mesh(new T.TorusGeometry(0.33, 0.035, 16, 64), new T.MeshStandardMaterial({ color: 0x60a5fa, emissive: 0x2563eb, emissiveIntensity: 1.6 })); ring.position.set(0, -0.25, 2.44); head.add(ring);
        for (let i = 0; i < 6; i++) { // LEDs IR
          const a = (i / 6) * Math.PI * 2;
          const led = new T.Mesh(new T.SphereGeometry(0.045, 16, 16), new T.MeshStandardMaterial({ color: 0x7f1d1d, emissive: 0xef4444, emissiveIntensity: 0.9 }));
          led.position.set(Math.cos(a) * 0.48, -0.25 + Math.sin(a) * 0.48, 2.42); head.add(led);
        }
        const logo = new T.Mesh(new T.BoxGeometry(0.5, 0.06, 0.01), new T.MeshStandardMaterial({ color: 0x1d4ed8 })); logo.position.set(0, 0.38, 1.6); logo.rotation.x = -0.15; head.add(logo);
        // cône de vision
        const cone = new T.Mesh(new T.ConeGeometry(2.2, 7, 48, 1, true), new T.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.08, side: T.DoubleSide, depthWrite: false }));
        cone.rotation.x = -Math.PI / 2; cone.position.set(0, -0.25, 5.9); head.add(cone);
        rig.position.set(0.3, -0.6, 0); rig.rotation.y = -0.5;

        // ---- Caméra dôme flottante ----
        const dome = new T.Group(); dome.position.set(-2.4, -1.4, 0.5); scene.add(dome);
        const dbase = new T.Mesh(new T.CylinderGeometry(0.75, 0.8, 0.25, 64), white); dome.add(dbase);
        const dglass = new T.Mesh(new T.SphereGeometry(0.6, 64, 32, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), glass); dglass.position.y = -0.12; dome.add(dglass);
        const deye = new T.Mesh(new T.SphereGeometry(0.22, 32, 32), dark); deye.position.set(0, -0.35, 0.25); dome.add(deye);
        dome.rotation.x = Math.PI; dome.scale.setScalar(0.85);

        // ---- Particules ----
        const pg = new T.BufferGeometry(); const N = 380; const pos = new Float32Array(N * 3);
        for (let i = 0; i < N; i++) { pos[i * 3] = (Math.random() - 0.5) * 16; pos[i * 3 + 1] = (Math.random() - 0.5) * 9; pos[i * 3 + 2] = (Math.random() - 0.5) * 8 - 2; }
        pg.setAttribute("position", new T.BufferAttribute(pos, 3));
        const pts = new T.Points(pg, new T.PointsMaterial({ color: 0x3b82f6, size: 0.04, transparent: true, opacity: 0.55 }));
        scene.add(pts);
        // sol ombre
        const ground = new T.Mesh(new T.PlaneGeometry(30, 30), new T.ShadowMaterial({ opacity: 0.12 })); ground.rotation.x = -Math.PI / 2; ground.position.y = -2.6; ground.receiveShadow = true; scene.add(ground);
        [body, visor, joint, arm, dbase].forEach(m => m.castShadow = true);

        let mx = 0, my = 0;
        const onMove = (e) => { mx = (e.clientX / window.innerWidth) * 2 - 1; my = (e.clientY / window.innerHeight) * 2 - 1; };
        window.addEventListener("mousemove", onMove);
        const onResize = () => { renderer.setSize(W(), H()); cam.aspect = W() / H(); cam.updateProjectionMatrix(); };
        window.addEventListener("resize", onResize);

        let raf; const clock = new T.Clock();
        const loop = () => {
          const t = clock.getElapsedTime();
          const auto = Math.sin(t * 0.6) * 0.25;
          head.rotation.y += ((mx * 0.9 + auto) - head.rotation.y) * 0.06;
          head.rotation.x += ((my * 0.35) - head.rotation.x) * 0.06;
          rig.position.y = -0.6 + Math.sin(t * 1.2) * 0.08;
          dome.position.y = -1.4 + Math.sin(t * 1.5 + 1) * 0.12; dome.rotation.y = t * 0.5;
          ring.material.emissiveIntensity = 1.2 + Math.sin(t * 3) * 0.6;
          cone.material.opacity = 0.06 + (Math.sin(t * 2) + 1) * 0.03;
          pts.rotation.y = t * 0.03;
          renderer.render(scene, cam);
          raf = requestAnimationFrame(loop);
        };
        loop();
        return () => { cancelAnimationFrame(raf); window.removeEventListener("mousemove", onMove); window.removeEventListener("resize", onResize); renderer.dispose(); el.innerHTML = ""; };
      }, []);
      return <div ref={mount} className="absolute inset-0" />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
