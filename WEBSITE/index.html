      .shine { display: none !important; }
      .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }

    [dir="rtl"], [dir="rtl"] body { font-family: 'Cairo', 'Tajawal', sans-serif; text-align: right; }

    /* Glass & Cards */
    .glass-light {
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(226, 232, 240, 0.85);
    }
    .card-light {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 20px -4px rgba(15, 23, 42, 0.04);
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .card-light:hover {
      border-color: #93c5fd;
      box-shadow: 0 20px 40px -15px rgba(37, 99, 235, 0.14);
    }

    /* Dark Mode (Tactical Night Vision) */
    body.dark-theme {
      --bg-canvas: #070b14;
      --bg-surface: #0f172a;
      --border-subtle: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      background-color: #070b14 !important;

    body.dark-theme .bg-slate-50\/60,
    body.dark-theme .bg-slate-50 { background-color: #070b14 !important; }
    body.dark-theme .glass-light {
      background: rgba(11, 17, 30, 0.86) !important;
      border-bottom-color: rgba(51, 65, 85, 0.65) !important;
    }
    body.dark-theme .card-light,
    body.dark-theme .tilt {
      background: #0f172a !important;
      border-color: #1e293b !important;
      color: #f8fafc !important;
    }
    body.dark-theme .card-light:hover,
    body.dark-theme .tilt:hover {
      border-color: #3b82f6 !important;

    body.dark-theme .text-slate-800 { color: #f8fafc !important; }
    body.dark-theme .text-slate-700,
    body.dark-theme .text-slate-600 { color: #cbd5e1 !important; }
    body.dark-theme .text-slate-500 { color: #94a3b8 !important; }
    body.dark-theme .bg-white { background-color: #0f172a !important; }
    body.dark-theme .border-slate-200,
    body.dark-theme .border-slate-100,
    body.dark-theme .border-slate-300 { border-color: #1e293b !important; }
    body.dark-theme input,
    body.dark-theme select,
    body.dark-theme textarea {
      background-color: #131c31 !important;
      border-color: #263554 !important;
      color: #f8fafc !important;
    }
    body.dark-theme nav.fixed.bottom-0 {
      background-color: rgba(15, 23, 42, 0.96) !important;
      border-top-color: #1e293b !important;
    }
    body.dark-theme nav.fixed.bottom-0 button {
      color: #94a3b8;
    }
    body.dark-theme nav.fixed.bottom-0 button.text-blue-600 {
      color: #38bdf8 !important;
    }

    /* 3D tilt cards */
    .tilt-wrap { perspective: 1100px; }
    .tilt {
      transform-style: preserve-3d;
      transition: transform 0.2s ease-out, box-shadow 0.28s ease, border-color 0.28s ease;
      will-change: transform;
    }
    .tilt:hover {
      border-color: #60a5fa;
      box-shadow: 0 28px 60px -18px rgba(37, 99, 235, 0.28);
    }
    .tilt .pop { transform: translateZ(38px); }
    .tilt .pop-sm { transform: translateZ(20px); }
    .shine {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(59, 130, 246, 0.14), rgba(255, 255, 255, 0.5) 35%, transparent 60%);
      opacity: 0;
      transition: opacity 0.25s;
    }
    .tilt:hover .shine { opacity: 1; }

    /* Reveal on scroll */
    .reveal { opacity: 1; transform: none; transition: opacity 0.4s ease, transform 0.4s ease; }
    .reveal.in { opacity: 1; transform: none; }

    /* Command Center Obsidian Hero */
    .hero-command {
      background:

    .text-gradient-hero {
      background: linear-gradient(90deg, #60a5fa, #38bdf8, #818cf8, #60a5fa);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

    .text-gradient {
      background: linear-gradient(90deg, #2563eb, #0ea5e9, #2563eb);

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 6s linear infinite;

    @keyframes shimmer { to { background-position: 200% center; } }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    .floaty { animation: floaty 4.5s ease-in-out infinite; }
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .marquee { animation: marquee 28s linear infinite; }
    .marquee:hover { animation-play-state: paused; }
    @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); } 100% { box-shadow: 0 0 0 18px rgba(16, 185, 129, 0); } }
    .wa-pulse { animation: pulse-ring 1.8s infinite; }
    @keyframes rec { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.25; transform: scale(0.85); } }
    .rec-dot { animation: rec 1.1s infinite; }
    @keyframes modalIn { from { opacity: 0; transform: perspective(900px) rotateX(8deg) translateY(24px) scale(0.96); } to { opacity: 1; transform: none; } }
    @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.4); } 100% { transform: scale(1); } }
    .bump { display: inline-block; animation: bump 0.4s ease; }
    .cube-scene { perspective: 900px; }
    .cube { transform-style: preserve-3d; animation: spin 18s linear infinite; }
    @keyframes spin { from { transform: rotateX(-18deg) rotateY(0); } to { transform: rotateX(-18deg) rotateY(360deg); } }
    ::-webkit-scrollbar { width: 8px; height: 8px; }

    }

            setProducts(list);
            return true;
          }
          return false;

          .then(r => r.ok ? r.json() : null)
          .then(d => {
            if (d) {
              setProducts(prev => (prev && prev.length > 0) ? prev : (d.results || (Array.isArray(d) ? d : [])));
            }
          })
          .catch(() => {});

        fetch("/catalog_home.json")
          .then(r => r.ok ? r.json() : null)
          .then(d => {
            if (d) {
              setHomeData(prev => prev || d);
            }

            if (resProds.status === 401 || resHome.status === 401) {
              localStorage.removeItem("cctv_jwt");
              setToken("");
            }
            const pubHeaders = { "Content-Type": "application/json" };
            [resHome, resProds] = await Promise.all([
              fetch(`${API_BASE}/catalog/home/`, { headers: pubHeaders }),
              fetch(`${API_BASE}/products/?limit=500`, { headers: pubHeaders })
            ]);
          }
          if (resHome && resHome.ok) {
            setHomeData(await resHome.json());
          }
          if (resProds && resProds.ok) {
            applyProds(await resProds.json());
          } else {
            const remoteRes = await fetch("https://infotech-zemri-backend.onrender.com/api/v1/products/?limit=500");
            if (remoteRes.ok) applyProds(await remoteRes.json());

        } catch (err) {

          customer_phone: checkoutForm.customer_phone,
          customer_email: checkoutForm.customer_email || "",
          company_name: checkoutForm.company_name || "",
          wilaya: activeWilayaObj ? activeWilayaObj.name : (checkoutForm.wilaya || "Oran"),
          wilaya_id: selectedWilayaId,
          commune: selectedCommune || "",
          delivery_commune: selectedCommune || "",
          delivery_type: deliveryType,
          delivery_method: deliveryType === "PICKUP" ? "PICKUP" : "DELIVERY",

          delivery_station_code: deliveryType === "STOPDESK" ? selectedStationCode : "",
          delivery_address: deliveryType === "PICKUP" ? "Retrait au magasin 4 Boulevard Didouche Mourad, Oran" : (checkoutForm.delivery_address || ""),

    /* ---------- Recherche dans l'en-tête avec suggestions instantanées ---------- */
    function HeaderSearch({ products, onPick, onSubmit }) {
      const [q, setQ] = useState("");
      const [open, setOpen] = useState(false);
      const hits = useMemo(() => {
        const words = q.toLowerCase().split(/\s+/).filter(Boolean);
        if (!words.length) return [];
        return products.filter(p => {
          const hay = `${p.name || ""} ${p.reference || ""} ${p.brand_name || ""}`.toLowerCase();
          return words.every(w => hay.includes(w));
        }).slice(0, 6);
      }, [q, products]);
      return (
        <form className="relative flex-1 max-w-md hidden md:block" onSubmit={e => { e.preventDefault(); if (q.trim()) { onSubmit(q.trim()); setOpen(false); } }}>
          <div className="relative flex items-center">
            <input value={q} onChange={e => { setQ(e.target.value); setOpen(true); }} onFocus={() => setOpen(true)} onBlur={() => setTimeout(() => setOpen(false), 180)}
              placeholder={`🔍  ${tr("search_ph")}`}
              className="w-full pl-4 pr-10 py-2.5 rounded-2xl bg-slate-100/90 border border-slate-200/80 focus:bg-white focus:border-blue-500 text-sm outline-none transition" />
            <button
              type="button"
              title="Recherche vocale"
              onClick={() => {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) { alert("La recherche vocale n'est pas supportée sur ce navigateur."); return; }
                const rec = new SR();
                rec.lang = (window.__currentLang === "ar" || window.__currentLang === "dz") ? "ar-DZ" : "fr-FR";
                rec.onresult = (ev) => {
                  const txt = ev.results[0][0].transcript;
                  setQ(txt);
                  onSubmit(txt);
                };
                rec.start();
              }}
              className="absolute right-2.5 w-7 h-7 rounded-xl hover:bg-blue-50 text-slate-500 hover:text-blue-600 flex items-center justify-center text-sm transition"
            >
              🎙️
            </button>
          </div>
          {open && hits.length > 0 && (
            <div className="absolute top-full mt-2 left-0 right-0 bg-white border border-slate-200 rounded-2xl shadow-2xl overflow-hidden z-50">
              {hits.map(p => (
                <button type="button" key={p.id} onMouseDown={() => { onPick(p); setQ(""); }} className="w-full flex items-center gap-3 px-3 py-2 hover:bg-slate-50 text-left">
                  <img src={getProductImg(p)} alt="" className="w-10 h-10 object-contain rounded-lg bg-slate-50" />
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-semibold text-slate-900 truncate">{p.name}</div>
                    <div className="text-[11px] text-slate-400 font-mono">{p.reference}</div>
                  </div>
                  <div className="text-xs font-bold text-blue-600 whitespace-nowrap">{fmtMoney(p.effective_price)}</div>
                </button>
              ))}
              <button type="submit" className="w-full px-3 py-2 text-xs font-semibold text-blue-600 bg-slate-50 hover:bg-slate-100">Voir tous les résultats pour « {q} » →</button>
            </div>
          )}
        </form>
      );
    }

    /* ---------- Compteur animé ---------- */
    function Counter({ to, label, suffix = "", dark = false }) {
      const [v, setV] = useState(0);
      useEffect(() => {
        let raf, start;
        const step = (t) => { start = start || t; const k = Math.min(1, (t - start) / 1400); setV(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1) raf = requestAnimationFrame(step); };
        raf = requestAnimationFrame(step); return () => cancelAnimationFrame(raf);
      }, [to]);
      return (
        <div className={`p-3 sm:p-3.5 rounded-2xl backdrop-blur text-center transition ${dark ? "bg-white/10 border border-white/15 text-white" : "bg-white/85 border border-slate-200 text-slate-900"}`}>
          <div className={`font-display font-mono-num text-xl sm:text-2xl font-extrabold ${dark ? "text-sky-400" : "text-slate-900"}`}>{v}{suffix}</div>
          <div className={`text-[10px] sm:text-[11px] font-semibold mt-0.5 ${dark ? "text-slate-300" : "text-slate-500"}`}>{label}</div>
        </div>
      );
    }

            new T.SphereGeometry(0.11, 16, 16),
            new T.MeshBasicMaterial({ color: i % 2 === 0 ? 0xef4444 : 0xfbbf24 })
          );
          led.position.set(Math.cos(a) * 1.12, Math.sin(a) * 1.12, 0.12);
          part6.add(led);
        }
        const topVisor = new T.Mesh(
          new T.CylinderGeometry(1.58, 1.58, 2.2, 48, 1, true, Math.PI * 1.15, Math.PI * 0.7),
          metalWhite
        );
        topVisor.material.side = T.DoubleSide;
        topVisor.rotation.x = Math.PI / 2;
        topVisor.rotation.y = Math.PI;
        topVisor.position.z = -0.5;
        part6.add(topVisor);
        explodedGroup.add(part6);

          new T.TorusGeometry(4.8, 0.025, 16, 100),
          new T.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.35 })

              // Subtle panning sweep

            });

            // Camera Viewpoint presets + user drag
            let targetCamPos = { x: 14, y: 11, z: 16 };
            let lookTarget = new T.Vector3(0, 1.2, 0);

            if (isScrollTouch) return;
            if (is3DTouch) {
              stateRef.current.userRotY -= dx * 0.007;
              stateRef.current.userRotX = Math.max(-0.35, Math.min(0.65, stateRef.current.userRotX + dy * 0.005));
            }
          } else if (isDragging) {
            stateRef.current.userRotY -= dx * 0.007;
            stateRef.current.userRotX = Math.max(-0.35, Math.min(0.65, stateRef.current.userRotX + dy * 0.005));
          }

          prevX = pt.clientX;
          prevY = pt.clientY;
        };

        const onUp = () => {
          isDragging = false;
          is3DTouch = false;
          isScrollTouch = false;
        };

        el.addEventListener("mousedown", onDown);
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
        el.addEventListener("touchstart", onDown, { passive: true });
        window.addEventListener("touchmove", onMove, { passive: true });
        window.addEventListener("touchend", onUp, { passive: true });

        const onResize = () => {
          if (!el) return;
          renderer.setSize(W(), H());
          camera.aspect = W() / H();
          camera.updateProjectionMatrix();
        };
        window.addEventListener("resize", onResize);

        // Cibles de caméra 3D pour chaque équipement cliqué !
        const zoneTargets = {
          cameras:  { cam: [-6.2, 5.2, 11.5], look: [-4.4, 3.2, 3.8] },
          alarm:    { cam: [2.2, 6.2, 9.8],   look: [1.65, 5.1, 2.8] },
          digicode: { cam: [8.8, 2.8, 12.2],  look: [6.2, 1.4, 7.6] },
          wifi_ptz: { cam: [8.5, 6.4, 10.8],  look: [4.8, 4.8, 2.8] },
          xvr_hdd:  { cam: [1.5, 3.0, 9.5],   look: [1.3, 1.6, 1.8] },
          power_poe:{ cam: [-7.5, 3.2, 10.2], look: [-4.2, 1.5, 2.5] }
        };

        let raf = null;
        let isElementVisible = true;
        const clock = new T.Clock();
        const curLook = new T.Vector3(0, 2.2, 1.5);

        // Optimisation Mobile majeure : pause le rendu 3D quand l'élément est hors de l'écran
        const io = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            isElementVisible = entry.isIntersecting;
            if (isElementVisible && !raf) {
              clock.start();
              raf = requestAnimationFrame(animate);
            }
          });
        }, { threshold: 0.02 });
        io.observe(el);

        const animate = () => {
          if (!isElementVisible) {
            raf = null;
            return;
          }
          const t = clock.getElapsedTime();
          const st = stateRef.current;

          // Animation des cônes des caméras 3D
          camFacade.group.rotation.y = -0.15 + Math.sin(t * 0.9) * 0.22;
          camPtz.group.rotation.y = 0.25 + Math.cos(t * 1.1) * 0.35;
          camFacade.coneMat.opacity = st.activeZone === "cameras" ? 0.38 : 0.16;
          camPtz.coneMat.opacity = st.activeZone === "wifi_ptz" ? 0.38 : 0.16;

          // Animation du Digicode 3D
          digiRing.scale.setScalar(1 + Math.sin(t * 4) * 0.15);

          // Animation Sirène d'Alarme 3D (Flash Rouge / Bleu)
          if (st.activeZone === "alarm") {
            const flash = Math.sin(t * 14) > 0;
            alarmStrobeRed.intensity = flash ? 4.5 : 0.4;
            alarmStrobeBlue.intensity = !flash ? 4.5 : 0.4;
            sirenBeacon.material.color.setHex(flash ? 0xef4444 : 0x3b82f6);
          } else {
            alarmStrobeRed.intensity = (Math.sin(t * 3) > 0.7) ? 1.2 : 0;
            alarmStrobeBlue.intensity = 0;
            sirenBeacon.material.color.setHex(0xef4444);
          }

          // Déplacement fluide de la caméra 3D (Soit Focus sur l'équipement cliqué, soit Vue Globale 360°)
          let desiredCam = { x: 13, y: 7.5, z: 16.5 };
          let desiredLook = { x: 0.5, y: 2.4, z: 1.5 };

          if (!st.viewOrbit && zoneTargets[st.activeZone]) {
            const zt = zoneTargets[st.activeZone];
            desiredCam = {
              x: zt.cam[0] + Math.sin(t * 0.5) * 0.45,
              y: zt.cam[1],
              z: zt.cam[2]
            };
            desiredLook = { x: zt.look[0], y: zt.look[1], z: zt.look[2] };
          } else {
            const a = t * 0.14 + st.userRotY;
            const r = 18.5;
            desiredCam = {
              x: Math.sin(a) * r,
              y: 7.2 + st.userRotX * 6,
              z: Math.cos(a) * r
            };
            desiredLook = { x: 0.5, y: 2.3, z: 1.5 };
          }

          camera.position.x += (desiredCam.x - camera.position.x) * 0.055;
          camera.position.y += (desiredCam.y - camera.position.y) * 0.055;
          camera.position.z += (desiredCam.z - camera.position.z) * 0.055;

          curLook.x += (desiredLook.x - curLook.x) * 0.07;
          curLook.y += (desiredLook.y - curLook.y) * 0.07;
          curLook.z += (desiredLook.z - curLook.z) * 0.07;
          camera.lookAt(curLook);

          renderer.render(scene, camera);
          raf = requestAnimationFrame(animate);
        };
        animate();

        return () => {
          if (raf) cancelAnimationFrame(raf);
          io.disconnect();
          el.removeEventListener("mousedown", onDown);
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onUp);
          el.removeEventListener("touchstart", onDown);
          window.removeEventListener("touchmove", onMove);
          window.removeEventListener("touchend", onUp);
          window.removeEventListener("resize", onResize);
          renderer.dispose();
        };
      }, []);

    /* ---------- Scène 3D (Three.js) : caméra de surveillance qui suit la souris (Optimisée Mobile) ---------- */
    function Hero3D() {
      const mount = React.useRef(null);
      useEffect(() => {
        const el = mount.current;
        if (!el || !window.THREE) return;
        const T = window.THREE;
        const W = () => el.clientWidth || 320, H = () => el.clientHeight || 320;
        const isMobile = typeof window !== "undefined" && (window.innerWidth < 768 || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent));

        const renderer = new T.WebGLRenderer({ antialias: false, alpha: true, powerPreference: "high-performance", precision: isMobile ? "mediump" : "highp" });
        renderer.setPixelRatio(isMobile ? 1.0 : Math.min(window.devicePixelRatio, 1.5));
        renderer.setSize(W(), H());
        renderer.shadowMap.enabled = !isMobile;
        el.innerHTML = "";
        el.appendChild(renderer.domElement);

        const scene = new T.Scene();
        const cam = new T.PerspectiveCamera(38, W() / H(), 0.1, 100);
        cam.position.set(0, 1.2, 9);

        scene.add(new T.HemisphereLight(0xffffff, 0xcbd5e1, 0.9));
        const key = new T.DirectionalLight(0xffffff, 1.1);
        key.position.set(4, 6, 5);
        if (!isMobile) key.castShadow = true;
        scene.add(key);
        const rim = new T.PointLight(0x3b82f6, 2.2, 20);
        rim.position.set(-4, 2, -2);
        scene.add(rim);

        const white = new T.MeshStandardMaterial({ color: 0xf8fafc, metalness: 0.25, roughness: 0.35 });
        const dark = new T.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.6, roughness: 0.25 });
        const glass = new T.MeshPhysicalMaterial({ color: 0x1e3a8a, metalness: 0.1, roughness: 0.05, transmission: 0.2, clearcoat: 1, opacity: 0.95, transparent: true });

        // ---- Caméra bullet ----
        const rig = new T.Group(); scene.add(rig);
        const wall = new T.Mesh(new T.CylinderGeometry(0.55, 0.55, 0.18, 32), white); wall.rotation.x = Math.PI / 2; wall.position.set(0, 1.6, -1.6); rig.add(wall);
        const arm = new T.Mesh(new T.CylinderGeometry(0.12, 0.12, 1.3, 20), white); arm.rotation.x = Math.PI / 2; arm.position.set(0, 1.6, -0.95); rig.add(arm);
        const joint = new T.Mesh(new T.SphereGeometry(0.22, 24, 24), white); joint.position.set(0, 1.6, -0.3); rig.add(joint);
        const head = new T.Group(); head.position.set(0, 1.6, -0.3); rig.add(head);
        const body = new T.Mesh(new T.CylinderGeometry(0.62, 0.62, 2.6, 36), white); body.rotation.x = Math.PI / 2; body.position.set(0, -0.25, 1.1); head.add(body);
        const visor = new T.Mesh(new T.CylinderGeometry(0.72, 0.72, 2.0, 36, 1, true, Math.PI * 1.15, Math.PI * 0.7), white);
        visor.material = white.clone(); visor.material.side = T.DoubleSide; visor.rotation.x = Math.PI / 2; visor.rotation.y = Math.PI; visor.position.set(0, -0.2, 1.6); head.add(visor);
        const face = new T.Mesh(new T.CircleGeometry(0.6, 36), dark); face.position.set(0, -0.25, 2.41); head.add(face);
        const lens = new T.Mesh(new T.SphereGeometry(0.26, 32, 32), glass); lens.scale.z = 0.45; lens.position.set(0, -0.25, 2.43); head.add(lens);
        const ring = new T.Mesh(new T.TorusGeometry(0.33, 0.035, 16, 36), new T.MeshStandardMaterial({ color: 0x60a5fa, emissive: 0x2563eb, emissiveIntensity: 1.6 })); ring.position.set(0, -0.25, 2.44); head.add(ring);
        for (let i = 0; i < 6; i++) { // LEDs IR
          const a = (i / 6) * Math.PI * 2;
          const led = new T.Mesh(new T.SphereGeometry(0.045, 12, 12), new T.MeshStandardMaterial({ color: 0x7f1d1d, emissive: 0xef4444, emissiveIntensity: 0.9 }));
          led.position.set(Math.cos(a) * 0.48, -0.25 + Math.sin(a) * 0.48, 2.42); head.add(led);
        }
        const logo = new T.Mesh(new T.BoxGeometry(0.5, 0.06, 0.01), new T.MeshStandardMaterial({ color: 0x1d4ed8 })); logo.position.set(0, 0.38, 1.6); logo.rotation.x = -0.15; head.add(logo);
        // cône de vision
        const cone = new T.Mesh(new T.ConeGeometry(2.2, 7, 32, 1, true), new T.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.08, side: T.DoubleSide, depthWrite: false }));
        cone.rotation.x = -Math.PI / 2; cone.position.set(0, -0.25, 5.9); head.add(cone);
        rig.position.set(0.3, -0.6, 0); rig.rotation.y = -0.5;

        // ---- Caméra dôme flottante ----
        const dome = new T.Group(); dome.position.set(-2.4, -1.4, 0.5); scene.add(dome);
        const dbase = new T.Mesh(new T.CylinderGeometry(0.75, 0.8, 0.25, 36), white); dome.add(dbase);
        const dglass = new T.Mesh(new T.SphereGeometry(0.6, 36, 24, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), glass); dglass.position.y = -0.12; dome.add(dglass);
        const deye = new T.Mesh(new T.SphereGeometry(0.22, 24, 24), dark); deye.position.set(0, -0.35, 0.25); dome.add(deye);
        dome.rotation.x = Math.PI; dome.scale.setScalar(0.85);

        // ---- Particules (allégées sur mobile) ----
        const N = isMobile ? 80 : 320;
        const pg = new T.BufferGeometry(); const pos = new Float32Array(N * 3);
        for (let i = 0; i < N; i++) { pos[i * 3] = (Math.random() - 0.5) * 16; pos[i * 3 + 1] = (Math.random() - 0.5) * 9; pos[i * 3 + 2] = (Math.random() - 0.5) * 8 - 2; }
        pg.setAttribute("position", new T.BufferAttribute(pos, 3));
        const pts = new T.Points(pg, new T.PointsMaterial({ color: 0x3b82f6, size: 0.04, transparent: true, opacity: 0.55 }));
        scene.add(pts);

        let mx = 0, my = 0;
        const onMove = (e) => {
          if (isMobile) return;
          mx = (e.clientX / window.innerWidth) * 2 - 1;
          my = (e.clientY / window.innerHeight) * 2 - 1;
        };
        window.addEventListener("mousemove", onMove);
        const onResize = () => {
          if (!el) return;
          renderer.setSize(W(), H());
          cam.aspect = W() / H();
          cam.updateProjectionMatrix();
        };
        window.addEventListener("resize", onResize);

        let raf = null;
        let isHeroVisible = true;
        const clock = new T.Clock();

        // Optimisation Mobile : arrêt du rendu quand la caméra Hero est hors de vue
        const io = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            isHeroVisible = entry.isIntersecting;
            if (isHeroVisible && !raf) {
              clock.start();
              raf = requestAnimationFrame(loop);
            }
          });
        }, { threshold: 0.02 });
        io.observe(el);

        const loop = () => {
          if (!isHeroVisible) {
            raf = null;
            return;
          }
          const t = clock.getElapsedTime();
          const auto = Math.sin(t * 0.6) * 0.25;
          head.rotation.y += ((mx * 0.9 + auto) - head.rotation.y) * 0.06;
          head.rotation.x += ((my * 0.35) - head.rotation.x) * 0.06;
          rig.position.y = -0.6 + Math.sin(t * 1.2) * 0.08;
          dome.position.y = -1.4 + Math.sin(t * 1.5 + 1) * 0.12; dome.rotation.y = t * 0.5;
          ring.material.emissiveIntensity = 1.2 + Math.sin(t * 3) * 0.6;
          cone.material.opacity = 0.06 + (Math.sin(t * 2) + 1) * 0.03;
          pts.rotation.y = t * 0.03;
          renderer.render(scene, cam);
          raf = requestAnimationFrame(loop);
        };
        loop();

        return () => {
          if (raf) cancelAnimationFrame(raf);
          io.disconnect();
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("resize", onResize);
          renderer.dispose();
          el.innerHTML = "";
        };
      }, []);
      return <div ref={mount} className="absolute inset-0" />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
