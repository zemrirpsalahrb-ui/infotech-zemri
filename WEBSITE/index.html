    :root {

      --text-muted: #64748b;

    body {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;

      color: var(--text-main);
      transition: background-color 0.3s ease, color 0.3s ease;
      overflow-x: hidden;

    .font-mono-num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .safe-area-bottom { padding-bottom: calc(0.4rem + env(safe-area-inset-bottom)); }
    }
    @media (max-width: 640px) {
      input, select, textarea { font-size: 16px !important; }
      .tilt { transform: none !important; }
    }
    [dir="rtl"], [dir="rtl"] body { font-family: 'Cairo', 'Tajawal', sans-serif; text-align: right; }
    [dir="rtl"] .font-display { font-family: 'Cairo', 'Tajawal', sans-serif; letter-spacing: 0; }
    .lang-btn-active { background-color: #2563eb; color: #ffffff !important; }
    .font-display { font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif; letter-spacing: -0.025em; }

    /* Glass & Cards */
    .glass-light {
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(226, 232, 240, 0.85);
    }
    .card-light {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 20px -4px rgba(15, 23, 42, 0.04);
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .card-light:hover {
      border-color: #93c5fd;
      box-shadow: 0 20px 40px -15px rgba(37, 99, 235, 0.14);
    }

    /* Dark Mode (Tactical Night Vision) */
    body.dark-theme {
      --bg-canvas: #070b14;
      --bg-surface: #0f172a;
      --border-subtle: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      background-color: #070b14 !important;
      color: #f8fafc !important;
    }
    body.dark-theme .bg-slate-50\/60,
    body.dark-theme .bg-slate-50 { background-color: #070b14 !important; }
    body.dark-theme .glass-light {
      background: rgba(11, 17, 30, 0.86) !important;
      border-bottom-color: rgba(51, 65, 85, 0.65) !important;
    }
    body.dark-theme .card-light,
    body.dark-theme .tilt {
      background: #0f172a !important;
      border-color: #1e293b !important;
      color: #f8fafc !important;
    }
    body.dark-theme .card-light:hover,
    body.dark-theme .tilt:hover {
      border-color: #3b82f6 !important;
      box-shadow: 0 24px 48px -15px rgba(37, 99, 235, 0.35) !important;
    }
    body.dark-theme .text-slate-900,
    body.dark-theme .text-slate-800 { color: #f8fafc !important; }
    body.dark-theme .text-slate-700,
    body.dark-theme .text-slate-600 { color: #cbd5e1 !important; }
    body.dark-theme .text-slate-500 { color: #94a3b8 !important; }
    body.dark-theme .bg-white { background-color: #0f172a !important; }
    body.dark-theme .border-slate-200,
    body.dark-theme .border-slate-100,
    body.dark-theme .border-slate-300 { border-color: #1e293b !important; }
    body.dark-theme input,
    body.dark-theme select,
    body.dark-theme textarea {
      background-color: #131c31 !important;
      border-color: #263554 !important;
      color: #f8fafc !important;
    }

    /* 3D tilt cards */
    .tilt-wrap { perspective: 1100px; }
    .tilt {
      transform-style: preserve-3d;
      transition: transform 0.2s ease-out, box-shadow 0.28s ease, border-color 0.28s ease;
      will-change: transform;
    }
    .tilt:hover {
      border-color: #60a5fa;
      box-shadow: 0 28px 60px -18px rgba(37, 99, 235, 0.28);
    }
    .tilt .pop { transform: translateZ(38px); }
    .tilt .pop-sm { transform: translateZ(20px); }
    .shine {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(59, 130, 246, 0.14), rgba(255, 255, 255, 0.5) 35%, transparent 60%);
      opacity: 0;
      transition: opacity 0.25s;
    }
    .tilt:hover .shine { opacity: 1; }

    /* Reveal on scroll */
    .reveal { opacity: 0; transform: translateY(28px) scale(0.985); transition: opacity 0.65s cubic-bezier(0.2, 0.7, 0.2, 1), transform 0.65s cubic-bezier(0.2, 0.7, 0.2, 1); }
    .reveal.in { opacity: 1; transform: none; }

    /* Command Center Obsidian Hero */
    .hero-command {
      background:
        radial-gradient(900px 480px at 82% 22%, rgba(37, 99, 235, 0.34), transparent 65%),
        radial-gradient(700px 420px at 15% 88%, rgba(6, 182, 212, 0.22), transparent 60%),
        linear-gradient(135deg, #050914 0%, #0b1329 52%, #09152e 100%);
    }
    .cyber-grid {
      background-image:
        linear-gradient(rgba(59, 130, 246, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59, 130, 246, 0.12) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse at 60% 50%, black 25%, transparent 78%);
    }
    .text-gradient-hero {
      background: linear-gradient(90deg, #60a5fa, #38bdf8, #818cf8, #60a5fa);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 5s linear infinite;
    }
    .text-gradient {
      background: linear-gradient(90deg, #2563eb, #0ea5e9, #2563eb);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 6s linear infinite;
    }
    @keyframes shimmer { to { background-position: 200% center; } }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    .floaty { animation: floaty 4.5s ease-in-out infinite; }
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .marquee { animation: marquee 28s linear infinite; }
    .marquee:hover { animation-play-state: paused; }
    @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); } 100% { box-shadow: 0 0 0 18px rgba(16, 185, 129, 0); } }
    .wa-pulse { animation: pulse-ring 1.8s infinite; }
    @keyframes rec { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.25; transform: scale(0.85); } }
    .rec-dot { animation: rec 1.1s infinite; }
    @keyframes modalIn { from { opacity: 0; transform: perspective(900px) rotateX(8deg) translateY(24px) scale(0.96); } to { opacity: 1; transform: none; } }
    @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.4); } 100% { transform: scale(1); } }
    .bump { display: inline-block; animation: bump 0.4s ease; }
    .cube-scene { perspective: 900px; }
    .cube { transform-style: preserve-3d; animation: spin 18s linear infinite; }
    @keyframes spin { from { transform: rotateX(-18deg) rotateY(0); } to { transform: rotateX(-18deg) rotateY(360deg); } }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 9999px; }
    @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; } .marquee, .cube, .floaty { animation: none; } }

    function getCategoryMeta(name) {
      const s = String(name || "").toLowerCase();

      if (s.includes("ptz")) return { icon: "🔭", color: "from-violet-600 to-indigo-500", tag: "Motorisée 360°" };

      if (s.includes("alarme") || s.includes("accès") || s.includes("acces") || s.includes("interphone") || s.includes("pointeuse")) return { icon: "🚨", color: "from-rose-600 to-red-500", tag: "Protection Active" };

    }

      // Calcul dynamique des frais de livraison NOEST

              String(p.name || "").toLowerCase() === q ||
              String(p.reference || "").toLowerCase().includes(q)

        document.querySelectorAll(".reveal:not(.in)").forEach(el => io.observe(el));

                  {/* Mode de livraison */}

                        onClick={() => { setDeliveryType("HOME"); setCheckoutForm(prev => ({ ...prev, delivery_method: "DELIVERY", stop_desk: false })); }}

                        <span className="text-[11px] text-slate-500 mt-0.5">À votre porte</span>
                        <span className="text-xs font-extrabold text-blue-600 mt-1">

                      <button

                        </span>
                      </button>

                        type="button"

                  {deliveryType !== "PICKUP" && (

                            const found = (wilayasList || []).find(w => w.id === wid);

                              <select
                                value={selectedCommune}
                                onChange={e => setSelectedCommune(e.target.value)}

                                {communesList.map((c, idx) => (

                              <input
                                placeholder="Votre commune"
                                value={selectedCommune}
                                onChange={e => setSelectedCommune(e.target.value)}
                                className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:border-blue-500 outline-none"
                              />
                            )}
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-slate-700 mb-1">Adresse précise *</label>
                            <input
                              required
                              placeholder="Quartier, rue, n° de porte, repère..."

                          </div>
                        </div>

                    </div>

                    <div className="p-3.5 rounded-2xl bg-purple-50 border border-purple-200 text-xs text-purple-900 space-y-1">
                      <div className="font-bold flex items-center gap-1.5">
                        <span>📍 Magasin INFOTECH ZEMRI</span>
                        <span className="px-2 py-0.5 rounded-full bg-purple-200 text-purple-800 font-extrabold text-[10px]">Gratuit</span>
                      </div>
                      <div>4 Boulevard Didouche Mourad, Oran (En face Jardin public)</div>
                      <div className="text-slate-600">Ouvert du Samedi au Jeudi de 08h30 à 18h00. Tél : 0557 88 27 19</div>
                    </div>

                    <input
                      placeholder="Remarque pour le livreur (optionnel)"

                      <span className="font-bold font-mono text-slate-800">{fmtMoney(cartSubtotal)}</span>
                    </div>

                      <span>Enregistrement chez NOEST...</span>

                      <>
                        <span>✓ Confirmer la commande</span>
                        <span className="text-xs bg-white/20 px-2.5 py-0.5 rounded-lg font-mono-num font-black">{fmtMoney(cartTotal)}</span>
                      </>
                    )}

                  {cart.length > 0 && (
                    <button
                      type="button"
                      onClick={printOfficialQuote}
                      className="w-full py-3 rounded-2xl bg-slate-100 hover:bg-slate-900 text-slate-700 hover:text-white font-extrabold text-xs transition flex items-center justify-center gap-2 border border-slate-200"
                    >
                      <span>📄</span>
                      <span>Imprimer / Télécharger un Devis Proforma Officiel (PDF)</span>
                    </button>
                  )}
                </form>
              </div>
            )}

                    <div className="space-y-4">

                        <div>Statut : <strong className="text-blue-600">{profile.approval_status}</strong></div>

                          <a href="/mon-dashboard/" className="px-5 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-bold">
                            ⚙ Ouvrir Mon Dashboard Privé
                          </a>

                          {tr("auth_logout")}
                        </button>
                      </div>

                        <button onClick={() => setAuthMode("register")} className={`flex-1 py-2.5 rounded-xl font-bold text-sm ${authMode === "register" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-600"}`}>{tr("auth_register")}</button>
                      </div>
                      {authMode === "login" ? (
                        <form onSubmit={handleLogin} className="space-y-4">
                          <input required placeholder={tr("auth_username")} value={loginForm.username} onChange={e => setLoginForm({ ...loginForm, username: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm" />
                          <input required type="password" placeholder={tr("auth_password")} value={loginForm.password} onChange={e => setLoginForm({ ...loginForm, password: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm" />
                          <button type="submit" className="w-full py-3 rounded-xl bg-slate-900 text-white font-bold text-sm">{tr("auth_submit_login")}</button>
                        </form>

                            <option value="RESELLER">Compte PRO Revendeur / Grossiste</option>
                            <option value="PUBLIC">Compte Client Standard</option>
                          </select>
                          <div className="grid grid-cols-2 gap-2">
                            <input required placeholder="Nom d'utilisateur *" value={regForm.username} onChange={e => setRegForm({ ...regForm, username: e.target.value })} className="px-3.5 py-2 rounded-xl border border-slate-200 text-sm" />

                          </div>
                          <button type="submit" className="w-full py-3 rounded-xl bg-blue-600 text-white font-bold text-sm">{tr("auth_submit_register")}</button>
                        </form>
                      )}
                    </>

                    <div className="p-4 rounded-xl bg-slate-50 border border-slate-200">

                      <p className="text-xs text-slate-500 mt-1">Accès libre et commande immédiate sans inscription.</p>
                    </div>
                    <div className="p-4 rounded-xl bg-blue-50/70 border border-blue-200">
                      <div className="font-bold text-blue-800">2. Installateur Professionnel</div>
                      <p className="text-xs text-blue-700 mt-1">Tarifs préférentiels activés après approbation administrateur.</p>
                    </div>
                    <div className="p-4 rounded-xl bg-emerald-50/70 border border-emerald-200">
                      <div className="font-bold text-emerald-800">3. Revendeur / Grossiste</div>
                      <p className="text-xs text-emerald-700 mt-1">Prix de gros synchronisés depuis LOGISZ après validation.</p>
                    </div>
                  </div>
                </div>
              </div>
            )}

            <ProductModal p={selectedProduct} tier={appliedTier} products={products} whatsapp={homeData && homeData.whatsapp}

              showToast={showToast}
              onDirectOrder={(prod) => {
                addToCart(prod, 1);
                setSelectedProduct(null);
                setTab("cart");
                window.scrollTo({ top: 0, behavior: "smooth" });
              }}
              onClose={() => setSelectedProduct(null)} onAdd={() => { addToCart(selectedProduct, 1); setSelectedProduct(null); }} />
          )}

          {/* BARRE FLOTTANTE DE COMMANDE RAPIDE (Quand le panier contient des articles) */}
          {cart.length > 0 && tab !== "cart" && !selectedProduct && (
            <div className="fixed bottom-16 lg:bottom-6 right-4 sm:right-6 z-40 max-w-md w-[calc(100vw-2rem)] sm:w-auto bg-slate-950/95 backdrop-blur-xl text-white border border-blue-500/40 rounded-2xl p-3 sm:p-3.5 shadow-[0_20px_50px_rgba(15,23,42,0.5)] flex items-center justify-between gap-3">
              <div className="flex items-center gap-2.5">
                <div className="flex -space-x-2 overflow-hidden">
                  {cart.slice(0, 3).map(i => (
                    <img key={i.product.id} src={getProductImg(i.product)} alt="" className="w-9 h-9 rounded-xl bg-white border-2 border-slate-900 object-contain p-0.5" />
                  ))}
                </div>
                <div>
                  <div className="text-[11px] text-slate-400 font-semibold">
                    {cart.reduce((s, i) => s + i.quantity, 0)} article(s) au panier
                  </div>
                  <div className="text-sm font-extrabold font-mono-num text-sky-400">
                    {fmtMoney(cartSubtotal)}
                  </div>
                </div>
              </div>
              <button
                onClick={() => goTab("cart")}
                className="px-4 py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-extrabold text-xs sm:text-sm shadow-lg shadow-blue-600/30 transition flex items-center gap-1.5 whitespace-nowrap"
              >
                <span>⚡ Commander</span>
                <span>→</span>
              </button>
            </div>
          )}

          {/* BARRE DE COMPARAISON */}
          {compare.length > 0 && (
            <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-40 bg-slate-900 text-white rounded-2xl shadow-2xl px-4 py-3 flex items-center gap-3 max-w-[95vw]">
              <div className="flex -space-x-2">
                {compare.map(c => <img key={c.id} src={getProductImg(c)} alt="" className="w-9 h-9 rounded-full border-2 border-slate-900 bg-white object-contain" />)}

              <span className="text-sm font-semibold hidden sm:inline">{compare.length} produit(s) à comparer</span>

            </div>
          )}

            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4" onClick={() => setShowCompare(false)}>

                  <h3 className="font-display text-2xl font-bold">{tr("comparator_title")}</h3>
                  <button onClick={() => setShowCompare(false)} className="w-9 h-9 rounded-full bg-slate-100 font-bold">✕</button>

                  <tbody>
                    {[
                      ["", c => <img src={getProductImg(c)} alt="" className="h-28 mx-auto object-contain" />],
                      [tr("product_label"), c => <span className="font-bold">{c.name}</span>],
                      ["Référence", c => <span className="font-mono text-xs">{c.reference}</span>],
                      ["Marque", c => c.brand_name || "—"],
                      ["Catégorie", c => c.category_name || "—"],
                      ["Prix", c => <span className="font-extrabold text-blue-600">{fmtMoney(c.effective_price)}</span>],
                      [tr("stock_label"), c => c.in_stock ? <span className="text-emerald-600 font-semibold">{c.available_stock} {tr("dispo")}</span> : <span className="text-red-600">Rupture</span>],
                      ["", c => <button onClick={() => addToCart(c, 1)} className="px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold">+ Panier</button>],
                    ].map(([label, fn], i) => (
                      <tr key={i} className={i % 2 ? "bg-slate-50" : ""}>
                        <td className="p-3 font-semibold text-slate-500 w-28">{label}</td>
                        {compare.map(c => <td key={c.id} className="p-3 text-center align-middle">{fn(c)}</td>)}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

    /* ---------- Recherche dans l'en-tête avec suggestions instantanées ---------- */
    function HeaderSearch({ products, onPick, onSubmit }) {
      const [q, setQ] = useState("");
      const [open, setOpen] = useState(false);
      const hits = useMemo(() => {
        const words = q.toLowerCase().split(/\s+/).filter(Boolean);
        if (!words.length) return [];
        return products.filter(p => {
          const hay = `${p.name || ""} ${p.reference || ""} ${p.brand_name || ""}`.toLowerCase();
          return words.every(w => hay.includes(w));
        }).slice(0, 6);
      }, [q, products]);
      return (
        <form className="relative flex-1 max-w-md hidden md:block" onSubmit={e => { e.preventDefault(); if (q.trim()) { onSubmit(q.trim()); setOpen(false); } }}>
          <div className="relative flex items-center">
            <input value={q} onChange={e => { setQ(e.target.value); setOpen(true); }} onFocus={() => setOpen(true)} onBlur={() => setTimeout(() => setOpen(false), 180)}
              placeholder={`🔍  ${tr("search_ph")}`}
              className="w-full pl-4 pr-10 py-2.5 rounded-2xl bg-slate-100/90 border border-slate-200/80 focus:bg-white focus:border-blue-500 text-sm outline-none transition" />
            <button
              type="button"
              title="Recherche vocale"
              onClick={() => {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) { alert("La recherche vocale n'est pas supportée sur ce navigateur."); return; }
                const rec = new SR();
                rec.lang = (window.__currentLang === "ar" || window.__currentLang === "dz") ? "ar-DZ" : "fr-FR";
                rec.onresult = (ev) => {
                  const txt = ev.results[0][0].transcript;
                  setQ(txt);
                  onSubmit(txt);
                };
                rec.start();
              }}
              className="absolute right-2.5 w-7 h-7 rounded-xl hover:bg-blue-50 text-slate-500 hover:text-blue-600 flex items-center justify-center text-sm transition"

    /* ---------- Compteur animé ---------- */
    function Counter({ to, label, suffix = "", dark = false }) {
      const [v, setV] = useState(0);
      useEffect(() => {
        let raf, start;
        const step = (t) => { start = start || t; const k = Math.min(1, (t - start) / 1400); setV(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1) raf = requestAnimationFrame(step); };
        raf = requestAnimationFrame(step); return () => cancelAnimationFrame(raf);
      }, [to]);
      return (
        <div className={`p-3 sm:p-3.5 rounded-2xl backdrop-blur text-center transition ${dark ? "bg-white/10 border border-white/15 text-white" : "bg-white/85 border border-slate-200 text-slate-900"}`}>
          <div className={`font-display font-mono-num text-xl sm:text-2xl font-extrabold ${dark ? "text-sky-400" : "text-slate-900"}`}>{v}{suffix}</div>
          <div className={`text-[10px] sm:text-[11px] font-semibold mt-0.5 ${dark ? "text-slate-300" : "text-slate-500"}`}>{label}</div>
        </div>
      );
    }

            camera.position.y += (targetCamPos.y - camera.position.y) * 0.06;
            camera.position.z += (targetCamPos.z - camera.position.z) * 0.06;

            strobeBlue.intensity = 0;

              -1.6 * ef,       // Part 2: Armored Shell

              1.1 * ef,        // Part 4: Sony Starvis 4K Sensor

    /* ---------- Scène 3D (Three.js) : caméra de surveillance qui suit la souris ---------- */
    function Hero3D() {
      const mount = React.useRef(null);
      useEffect(() => {
        const el = mount.current;
        if (!el || !window.THREE) return;
        const T = window.THREE;
        const W = () => el.clientWidth, H = () => el.clientHeight;
        const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(W(), H());
        renderer.shadowMap.enabled = true;
        el.appendChild(renderer.domElement);
        const scene = new T.Scene();
        const cam = new T.PerspectiveCamera(38, W() / H(), 0.1, 100);
        cam.position.set(0, 1.2, 9);

        scene.add(new T.HemisphereLight(0xffffff, 0xcbd5e1, 0.9));
        const key = new T.DirectionalLight(0xffffff, 1.1); key.position.set(4, 6, 5); key.castShadow = true; scene.add(key);
        const rim = new T.PointLight(0x3b82f6, 2.2, 20); rim.position.set(-4, 2, -2); scene.add(rim);

        const white = new T.MeshStandardMaterial({ color: 0xf8fafc, metalness: 0.25, roughness: 0.35 });
        const dark = new T.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.6, roughness: 0.25 });
        const glass = new T.MeshPhysicalMaterial({ color: 0x1e3a8a, metalness: 0.1, roughness: 0.05, transmission: 0.2, clearcoat: 1, opacity: 0.95, transparent: true });

        // ---- Caméra bullet ----
        const rig = new T.Group(); scene.add(rig);
        const wall = new T.Mesh(new T.CylinderGeometry(0.55, 0.55, 0.18, 48), white); wall.rotation.x = Math.PI / 2; wall.position.set(0, 1.6, -1.6); rig.add(wall);
        const arm = new T.Mesh(new T.CylinderGeometry(0.12, 0.12, 1.3, 24), white); arm.rotation.x = Math.PI / 2; arm.position.set(0, 1.6, -0.95); rig.add(arm);
        const joint = new T.Mesh(new T.SphereGeometry(0.22, 32, 32), white); joint.position.set(0, 1.6, -0.3); rig.add(joint);
        const head = new T.Group(); head.position.set(0, 1.6, -0.3); rig.add(head);
        const body = new T.Mesh(new T.CylinderGeometry(0.62, 0.62, 2.6, 64), white); body.rotation.x = Math.PI / 2; body.position.set(0, -0.25, 1.1); head.add(body);
        const visor = new T.Mesh(new T.CylinderGeometry(0.72, 0.72, 2.0, 64, 1, true, Math.PI * 1.15, Math.PI * 0.7), white);
        visor.material = white.clone(); visor.material.side = T.DoubleSide; visor.rotation.x = Math.PI / 2; visor.rotation.y = Math.PI; visor.position.set(0, -0.2, 1.6); head.add(visor);
        const face = new T.Mesh(new T.CircleGeometry(0.6, 64), dark); face.position.set(0, -0.25, 2.41); head.add(face);
        const lens = new T.Mesh(new T.SphereGeometry(0.26, 48, 48), glass); lens.scale.z = 0.45; lens.position.set(0, -0.25, 2.43); head.add(lens);
        const ring = new T.Mesh(new T.TorusGeometry(0.33, 0.035, 16, 64), new T.MeshStandardMaterial({ color: 0x60a5fa, emissive: 0x2563eb, emissiveIntensity: 1.6 })); ring.position.set(0, -0.25, 2.44); head.add(ring);
        for (let i = 0; i < 6; i++) { // LEDs IR
          const a = (i / 6) * Math.PI * 2;
          const led = new T.Mesh(new T.SphereGeometry(0.045, 16, 16), new T.MeshStandardMaterial({ color: 0x7f1d1d, emissive: 0xef4444, emissiveIntensity: 0.9 }));
          led.position.set(Math.cos(a) * 0.48, -0.25 + Math.sin(a) * 0.48, 2.42); head.add(led);
        }
        const logo = new T.Mesh(new T.BoxGeometry(0.5, 0.06, 0.01), new T.MeshStandardMaterial({ color: 0x1d4ed8 })); logo.position.set(0, 0.38, 1.6); logo.rotation.x = -0.15; head.add(logo);
        // cône de vision
        const cone = new T.Mesh(new T.ConeGeometry(2.2, 7, 48, 1, true), new T.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.08, side: T.DoubleSide, depthWrite: false }));
        cone.rotation.x = -Math.PI / 2; cone.position.set(0, -0.25, 5.9); head.add(cone);
        rig.position.set(0.3, -0.6, 0); rig.rotation.y = -0.5;

        // ---- Caméra dôme flottante ----
        const dome = new T.Group(); dome.position.set(-2.4, -1.4, 0.5); scene.add(dome);
        const dbase = new T.Mesh(new T.CylinderGeometry(0.75, 0.8, 0.25, 64), white); dome.add(dbase);
        const dglass = new T.Mesh(new T.SphereGeometry(0.6, 64, 32, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), glass); dglass.position.y = -0.12; dome.add(dglass);
        const deye = new T.Mesh(new T.SphereGeometry(0.22, 32, 32), dark); deye.position.set(0, -0.35, 0.25); dome.add(deye);
        dome.rotation.x = Math.PI; dome.scale.setScalar(0.85);

        // ---- Particules ----
        const pg = new T.BufferGeometry(); const N = 380; const pos = new Float32Array(N * 3);
        for (let i = 0; i < N; i++) { pos[i * 3] = (Math.random() - 0.5) * 16; pos[i * 3 + 1] = (Math.random() - 0.5) * 9; pos[i * 3 + 2] = (Math.random() - 0.5) * 8 - 2; }
        pg.setAttribute("position", new T.BufferAttribute(pos, 3));
        const pts = new T.Points(pg, new T.PointsMaterial({ color: 0x3b82f6, size: 0.04, transparent: true, opacity: 0.55 }));
        scene.add(pts);
        // sol ombre
        const ground = new T.Mesh(new T.PlaneGeometry(30, 30), new T.ShadowMaterial({ opacity: 0.12 })); ground.rotation.x = -Math.PI / 2; ground.position.y = -2.6; ground.receiveShadow = true; scene.add(ground);
        [body, visor, joint, arm, dbase].forEach(m => m.castShadow = true);

        let mx = 0, my = 0;
        const onMove = (e) => { mx = (e.clientX / window.innerWidth) * 2 - 1; my = (e.clientY / window.innerHeight) * 2 - 1; };
        window.addEventListener("mousemove", onMove);
        const onResize = () => { renderer.setSize(W(), H()); cam.aspect = W() / H(); cam.updateProjectionMatrix(); };
        window.addEventListener("resize", onResize);

        let raf; const clock = new T.Clock();
        const loop = () => {
          const t = clock.getElapsedTime();
          const auto = Math.sin(t * 0.6) * 0.25;
          head.rotation.y += ((mx * 0.9 + auto) - head.rotation.y) * 0.06;
          head.rotation.x += ((my * 0.35) - head.rotation.x) * 0.06;
          rig.position.y = -0.6 + Math.sin(t * 1.2) * 0.08;
          dome.position.y = -1.4 + Math.sin(t * 1.5 + 1) * 0.12; dome.rotation.y = t * 0.5;
          ring.material.emissiveIntensity = 1.2 + Math.sin(t * 3) * 0.6;
          cone.material.opacity = 0.06 + (Math.sin(t * 2) + 1) * 0.03;
          pts.rotation.y = t * 0.03;
          renderer.render(scene, cam);
          raf = requestAnimationFrame(loop);
        };
        loop();
        return () => { cancelAnimationFrame(raf); window.removeEventListener("mousemove", onMove); window.removeEventListener("resize", onResize); renderer.dispose(); el.innerHTML = ""; };
      }, []);
      return <div ref={mount} className="absolute inset-0" />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  
</body>
</html>
